<!doctype html><html lang="id"><head><meta charset="utf-8"></head><body><pre id="result">Testing</pre><iframe id="view" style="position:absolute;left:-9999px;top:0;width:390px;height:820px" title="Visual layout check"></iframe><script>
const f=document.getElementById("view"),result=document.getElementById("result"),sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.addEventListener("load",async()=>{
 const d=f.contentDocument;const report={};
 try{
  await sleep(120);
  d.querySelector('[data-page="production"]').click();await sleep(60);
  d.querySelector('[data-action="new-content"]').click();await sleep(60);
  const form=d.querySelector("#content-form");if(!form)throw Error("No Content form");
  const check=(group)=>{const row=form.querySelector('[data-group="'+group+'"] .rh-compact-row');if(!row)throw Error("Missing "+group);const menu=row.querySelector(".rh-item-options>summary"),input=row.querySelector("textarea,input,select");return {menuTop:Math.round(menu.getBoundingClientRect().top),inputTop:Math.round(input.getBoundingClientRect().top),delta:Math.round(menu.getBoundingClientRect().top-input.getBoundingClientRect().top),rowHeight:Math.round(row.getBoundingClientRect().height)}};
  report.script=check("script");report.shots=check("shots");report.checklist=check("checklist");report.references=check("references");
  const detail=form.querySelector('[data-group="shots"] .rh-shot-extra');
  detail.open=true;await sleep(30);report.shotWithDetails=check("shots");
  const groups=[report.script,report.shots,report.checklist,report.references,report.shotWithDetails];
  if(groups.some(x=>Math.abs(x.delta)>5))throw Error("Menu misaligned with input");
  d.querySelector('[data-action="close"]').click();await sleep(40);
  d.querySelector('[data-page="brand"]').click();await sleep(50);
  d.querySelector('[data-action="new-brand"]').click();await sleep(60);
  const colForm=d.querySelector("#brand-form"),row=colForm.querySelector('[data-group="deliverables_checklist"] .rh-compact-row');
  const m=row.querySelector(".rh-item-options>summary"),t=row.querySelector('input[data-field="text"]');
  report.collab={delta:Math.round(m.getBoundingClientRect().top-t.getBoundingClientRect().top),rowHeight:Math.round(row.getBoundingClientRect().height)};
  if(Math.abs(report.collab.delta)>5)throw Error("Collaboration menu misaligned");
  result.textContent=JSON.stringify({ok:true,...report});
 }catch(err){result.textContent=JSON.stringify({ok:false,error:String(err.message),...report});}
},{once:true});f.src="/?alignment-qa="+Date.now();
</script></body></html>
