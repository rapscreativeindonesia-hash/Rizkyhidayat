<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><pre id="qa">starting</pre><iframe id="frame" src="about:blank" style="position:absolute;left:-6000px;top:0;width:390px;height:820px" title="private QA"></iframe><script>
const out=document.querySelector("#qa"),iframe=document.querySelector("#frame");
const delay=ms=>new Promise(ok=>setTimeout(ok,ms));
const check=(v,m)=>{if(!v)throw Error(m)};
const round=n=>Math.round(n);
let tests={};
async function run(){
 try{
  const w=iframe.contentWindow,d=w.document;
  await delay(210);
  w.scrollTo(0,380);await delay(70);
  const before=w.scrollY;
  d.querySelector('[data-page="brand"]').click();await delay(50);
  d.querySelector('[data-action="new-brand"]').click();await delay(90);
  const modal=d.querySelector("#modal-layer.open .modal");
  const form=d.querySelector("#brand-form");
  const area=form?.querySelector(".rh-form-scrollbody");
  const heading=modal?.querySelector(".modal-head");
  const footer=form?.querySelector(":scope > .form-actions");
  check(modal&&area&&heading&&footer,"Pinned modal structure missing");
  const y0={head:heading.getBoundingClientRect().top,footer:footer.getBoundingClientRect().top,modal:modal.getBoundingClientRect().top,page:w.scrollY};
  const fixedBody=d.body.classList.contains("rh-modal-locked");
  const footerAlwaysVisible=()=>footer.getBoundingClientRect().bottom<=iframe.clientHeight+3&&footer.getBoundingClientRect().top>=-3;
  const headAlwaysVisible=()=>heading.getBoundingClientRect().top>=-3;
  check(fixedBody,"Background is not locked");
  check(footerAlwaysVisible()&&headAlwaysVisible(),"Header/footer not visible");
  area.scrollTop=1400;area.dispatchEvent(new w.Event("scroll"));await delay(110);
  const y1={head:heading.getBoundingClientRect().top,footer:footer.getBoundingClientRect().top,modal:modal.getBoundingClientRect().top,page:w.scrollY};
  tests.collaboration={backgroundLocked:fixedBody,innerScrolled:area.scrollTop>500,headerStayed:Math.abs(y0.head-y1.head)<=2,footerStayed:Math.abs(y0.footer-y1.footer)<=2,modalStayed:Math.abs(y0.modal-y1.modal)<=2,footerVisible:footerAlwaysVisible(),headVisible:headAlwaysVisible(),scrollAfter:round(area.scrollTop)};
  check(Object.values(tests.collaboration).every(Boolean),"Collaboration modal failed "+JSON.stringify(tests.collaboration));
  const brandInput=form.querySelector('[name="name"]');brandInput.value="QA pinned "+Date.now();brandInput.dispatchEvent(new w.Event("input",{bubbles:true}));
  footer.querySelector('button[type="submit"]').click();await delay(130);
  tests.saved={modalClosed:!d.querySelector("#modal-layer").classList.contains("open"),backgroundUnlocked:!d.body.classList.contains("rh-modal-locked"),brandCreated:[...d.querySelectorAll(".rh-collab-card")].some(el=>el.textContent.includes(brandInput.value)),scrollRestored:Math.abs(w.scrollY-before)<=2};
  check(Object.values(tests.saved).every(Boolean),"Collaboration save after pinned scroll failed "+JSON.stringify(tests.saved));
  d.querySelector('[data-page="production"]').click();await delay(60);
  d.querySelector('[data-action="new-content"]').click();await delay(70);
  const c=d.querySelector("#content-form"),cArea=c?.querySelector(".rh-form-scrollbody"),cFooter=c?.querySelector(":scope > .form-actions");
  check(cArea&&cFooter,"Content pinned structure missing");
  let top1=cFooter.getBoundingClientRect().top;
  cArea.scrollTop=2200;await delay(80);
  tests.content={scrolled:cArea.scrollTop>700,footerPinned:Math.abs(cFooter.getBoundingClientRect().top-top1)<=2,footerVisible:cFooter.getBoundingClientRect().bottom<=iframe.clientHeight+3};
  check(Object.values(tests.content).every(Boolean),"Content modal footer failed "+JSON.stringify(tests.content));
  d.querySelector("#modal-layer .rh-modal-close").click();await delay(60);
  tests.content.closeUnlocked=!d.body.classList.contains("rh-modal-locked");
  check(tests.content.closeUnlocked,"X did not unlock background");
  // All test edits remain in this isolated browser profile.
  out.textContent=JSON.stringify({ok:true,tests});
 }catch(error){out.textContent=JSON.stringify({ok:false,error:String(error?.message||error),tests});}
}
iframe.addEventListener("load",run,{once:true});
iframe.src="/?fixed-modal-qa="+Date.now();
</script></body></html>
