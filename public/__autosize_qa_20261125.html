<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><pre id="result">running</pre><iframe id="frame" src="about:blank" title="QA only" style="position:absolute;left:-9999px;top:0;width:390px;height:820px"></iframe><script>
const f=document.querySelector("#frame"),out=document.querySelector("#result");
const pause=t=>new Promise(r=>setTimeout(r,t));
const check=(x,m)=>{if(!x)throw Error(m)};
const makeText=()=>"Ini adalah satu kalimat script yang dibuat sangat panjang untuk memastikan kolom input membesar sesuai tulisan, tetap terbaca seluruhnya, tidak terpotong, dan aman ketika pengguna memakai iPhone. ".repeat(5)+"\nKalimat kedua tetap harus terlihat.\nKalimat ketiga tetap harus terlihat.";
async function go(){
 const w=f.contentWindow,d=w.document;
 let checks={};
 try{
  await pause(200);
  d.querySelector('[data-page="production"]').click();
  await pause(70);
  d.querySelector('[data-action="new-content"]').click();
  await pause(100);
  const form=d.querySelector("#content-form");check(form,"Content editor missing");
  const title=form.querySelector('[name="title"]'),txt=form.querySelector('[data-group="script"] textarea[data-field="text"]');
  check(txt,"Script textarea missing");
  const baseline=txt.getBoundingClientRect().height;
  const value=makeText();
  txt.value=value;txt.dispatchEvent(new w.Event("input",{bubbles:true}));
  await pause(100);
  const grown=txt.getBoundingClientRect().height,scroll=txt.scrollHeight,overflow=w.getComputedStyle(txt).overflowY;
  checks.content={initialHeight:Math.round(baseline),grownHeight:Math.round(grown),scrollHeight:Math.round(scroll),overflow,visible:grown>=scroll,lines:(value.match(/\n/g)||[]).length+1,computedFont:w.getComputedStyle(txt).fontSize};
  check(grown>baseline+120,"Script box did not grow with text");
  check(grown>=scroll-3,"Script content is clipped");
  title.value="QA autosize "+Date.now();title.dispatchEvent(new w.Event("input",{bubbles:true}));
  const shots=d.querySelector('[data-group="shots"] textarea[data-field="text"]');
  check(shots,"Shot textarea missing");
  shots.value=value;shots.dispatchEvent(new w.Event("input",{bubbles:true}));
  await pause(75);
  checks.shot={height:Math.round(shots.getBoundingClientRect().height),scrollHeight:shots.scrollHeight,visible:shots.getBoundingClientRect().height>=shots.scrollHeight-3};
  check(checks.shot.visible,"Shot is clipped");
  form.querySelector('[type="submit"]').click();await pause(120);
  checks.content.saved=!d.querySelector("#modal-layer").classList.contains("open");
  check(checks.content.saved,"Save did not close Content form");
  const name=title.value;
  const card=[...d.querySelectorAll(".rh-project-card")].find(x=>x.textContent.includes(name));
  check(card,"Saved Content card missing");
  card.querySelector('[data-action="edit-content"]').click();await pause(110);
  const restored=d.querySelector('#content-form [data-group="script"] textarea[data-field="text"]');
  checks.content.restoredValue=restored.value===value;
  checks.content.restoredHeight=Math.round(restored.getBoundingClientRect().height);
  checks.content.restoredVisible=restored.getBoundingClientRect().height>=restored.scrollHeight-3;
  check(checks.content.restoredValue&&checks.content.restoredVisible,"Restored content clipped or missing");
  d.querySelector("#content-form [data-action='close']").click();await pause(60);
  d.querySelector('[data-page="brand"]').click();await pause(80);
  d.querySelector('[data-action="new-brand"]').click();await pause(75);
  const brand=d.querySelector("#brand-form"),notes=brand?.querySelector('[name="notes"]');check(notes,"Brand notes textarea missing");
  const small=notes.getBoundingClientRect().height;
  notes.value=value;notes.dispatchEvent(new w.Event("input",{bubbles:true}));await pause(75);
  checks.collaboration={initialHeight:Math.round(small),expandedHeight:Math.round(notes.getBoundingClientRect().height),scrollHeight:notes.scrollHeight,visible:notes.getBoundingClientRect().height>=notes.scrollHeight-3};
  check(checks.collaboration.expandedHeight>small&&checks.collaboration.visible,"Collaboration notes clipped");
  out.textContent=JSON.stringify({ok:true,checks});
  // Test uses isolated browser local state, no user's data.
 }catch(e){out.textContent=JSON.stringify({ok:false,error:String(e),checks});}
}
f.addEventListener("load",go,{once:true});f.src="/?qa-autosize="+Date.now();
</script></body></html>
