<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Content Save QA</title></head><body><h1>Content Save QA</h1><pre id="qa-result">running</pre><iframe id="dash" src="about:blank" style="position:absolute;top:-4000px;width:1060px;height:860px" title="Isolated save test"></iframe><script>
const report=(info)=>{document.getElementById("qa-result").textContent=JSON.stringify(info)};
const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
const ensure=(v,msg)=>{if(!v)throw Error(msg)};
async function run(){
 const f=document.getElementById("dash");let reload=false;
 try{
  await sleep(50);
  const w=f.contentWindow,d=w.document;
  ensure(d.querySelector('[data-page="production"]'),"navigation missing");
  d.querySelector('[data-page="production"]').click();await sleep(35);
  const add=d.querySelector('[data-action="new-content"]');ensure(add,"new-content button missing");add.click();await sleep(30);
  const form=d.getElementById("content-form");ensure(form,"content form missing");
  const title="QA isolated Content "+Date.now();
  const set=(e,value)=>{ensure(e,"field missing");e.value=value;e.dispatchEvent(new w.Event("input",{bubbles:true}));};
  set(form.querySelector('input[name="title"]'),title);
  set(form.querySelector('.rh-builder-list[data-kind="script"] textarea[data-field="text"]'),"Script Hook tersimpan");
  const ref=form.querySelector('.rh-builder-list[data-kind="references"] input[data-field="url"]');ensure(ref,"ref input missing");set(ref,"tautan belum lengkap tanpa https");
  const debug={errors:[],alerts:[],docSubmitCapture:0,docSubmitBubble:0};try{w.localStorage.setItem("__qa_probe","works");debug.localStorageWorks=w.localStorage.getItem("__qa_probe")==="works";w.localStorage.removeItem("__qa_probe");}catch(e){debug.storageError=String(e)}d.addEventListener("submit",()=>debug.docSubmitCapture++,true);d.addEventListener("submit",()=>debug.docSubmitBubble++);w.addEventListener("error",e=>debug.errors.push(String(e.message||e.error||"unknown")));w.addEventListener("unhandledrejection",e=>debug.errors.push("rejection: "+String(e.reason)));w.alert=msg=>debug.alerts.push(String(msg));
  let fired=0;form.addEventListener("submit",()=>fired++);
  const b=form.querySelector('button[type="submit"]');ensure(b,"submit button missing");b.click();await sleep(90);
  const local=JSON.parse(w.localStorage.getItem("iky-creator-hub-local-v1")||"{}");
  const item=(local.ideas||[]).find(x=>x.title===title);
  const count1=(d.querySelectorAll(".rh-project-card")||[]).length;
  const hadModal=d.getElementById("modal-layer")?.classList.contains("open");
  const diagnostics={debug,enteredTitle:form.querySelector('input[name="title"]')?.value,titleFromFormData:new w.FormData(form).get("title"),submitFired:fired,noValidate:form.noValidate,checkValidity:form.checkValidity(),invalidFields:[...form.elements].filter(e=>e.willValidate&&!e.checkValidity()).map(e=>({name:e.name,type:e.type,value:e.value,reason:e.validationMessage})),localKeys:Object.keys(local),ideaCount:(local.ideas||[]).length,titles:(local.ideas||[]).map(x=>x.title).slice(0,5),cardCount:count1,modalOpen:hadModal,notice:d.getElementById("save-notice")?.textContent,bodyTail:d.body.innerText.slice(-330),contentID:form.dataset.draftContentId};
  report({stage:"post-submit",...diagnostics});
  ensure(fired===1,"Submit blocked: "+JSON.stringify(diagnostics));
  ensure(item,"Created content not present in browser storage: "+JSON.stringify(diagnostics));
  ensure(count1>=1,"Created content not visible in Content list");
  ensure(!hadModal,"Form did not close after save");
  f.onload=null;
  const loadPromise=new Promise((ok,bad)=>{f.onload=ok;setTimeout(()=>bad(Error("reload timeout")),10000)});
  f.src="/?qa-save-reload="+Date.now();await loadPromise;await sleep(70);
  const reloadedCount=(f.contentWindow.document.querySelectorAll(".rh-project-card")||[]).length;
  f.contentWindow.document.querySelector('[data-page="production"]').click();await sleep(30);
  const afterReload=f.contentWindow.document.body.innerText.includes(title);
  const after=JSON.parse(f.contentWindow.localStorage.getItem("iky-creator-hub-local-v1")||"{}");
  const storedAgain=(after.ideas||[]).some(x=>x.title===title);
  report({ok:afterReload&&storedAgain,submitFired:fired,createdInLocalStorage:!!item,cardVisibleAfterSave:count1>0,modalClosed:!hadModal,cardVisibleAfterReload:afterReload,storedAfterReload:storedAgain,referencePreserved:item?.references?.[0]?.url==="tautan belum lengkap tanpa https"});
  f.contentWindow.localStorage.removeItem("iky-creator-hub-local-v1");
 }catch(e){report({ok:false,error:String(e?.message||e)});}
}
const iframe=document.getElementById("dash");iframe.src="/?qa-save-isolated=20261125";iframe.addEventListener("load",run,{once:true});
</script></body></html>
