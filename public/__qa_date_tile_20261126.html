<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><pre id="qa">Running date tile checks</pre><iframe id="f" src="about:blank" style="position:absolute;left:-8000px;top:0;width:1194px;height:950px;border:0" title="Isolated date input regression"></iframe><script>
const output=document.querySelector("#qa"),frame=document.querySelector("#f"),sleep=x=>new Promise(r=>setTimeout(r,x));
const assert=(x,message)=>{if(!x)throw Error(message)};
const report={};
function dim(el){const r=el.getBoundingClientRect();return {x:r.x,left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};}
async function checkPage(){
 try{
 const w=frame.contentWindow,d=w.document;await sleep(130);
 d.querySelector('[data-page="production"]').click();await sleep(50);
 d.querySelector('[data-action="new-content"]').click();await sleep(65);
 const form=d.querySelector("#content-form");assert(form,"Content editor missing");
 const shooting=form.querySelector('input[name="shoot_date"]'),posting=form.querySelector('input[name="date"]');
 const shotTile=shooting.closest(".rh-date-shell"),postTile=posting.closest(".rh-date-shell");
 assert(shotTile&&postTile,"Custom date tile missing");
 const a=dim(shotTile),b=dim(postTile);
 const style=w.getComputedStyle(shooting);
 report.content={shootingTile:a,postingTile:b,gap:Math.round(b.left-a.right),nativeOpacity:style.opacity,nativePosition:style.position,nativeValue:shooting.value,displayText:shotTile.querySelector(".rh-date-text").textContent};
 assert(a.right<=b.left-8||Math.abs(a.top-b.top)>20,"Date tiles still touch or overlap");
 assert(style.opacity==="0"&&style.position==="absolute","Native Safari date paint not hidden");
 shooting.value="2026-12-21";shooting.dispatchEvent(new w.Event("change",{bubbles:true}));
 assert(shotTile.querySelector(".rh-date-text").textContent==="21 Des 2026","Date visual not synced after selection");
 posting.value="2026-12-23";posting.dispatchEvent(new w.Event("change",{bubbles:true}));
 const title=form.querySelector('[name="title"]');
 title.value="Date tile QA "+Date.now();title.dispatchEvent(new w.Event("input",{bubbles:true}));
 form.querySelector('[type="submit"]').click();await sleep(100);
 const saved=JSON.parse(w.localStorage.getItem("iky-creator-hub-local-v1")||"{}").ideas?.find(x=>x.title===title.value);
 report.content.savePersistsDates=!!saved&&saved.shoot_date==="2026-12-21"&&saved.date==="2026-12-23";
 assert(report.content.savePersistsDates,"Content date values not saved");
 d.querySelector('[data-page="brand"]').click();await sleep(55);
 d.querySelector('[data-action="new-brand"]').click();await sleep(75);
 const collab=d.querySelector("#brand-form");assert(collab,"Brand editor missing");
 const d1=collab.querySelector('input[name="deadline"]'),d2=collab.querySelector('input[name="post_date"]');
 assert(d1?.closest(".rh-date-shell")&&d2?.closest(".rh-date-shell"),"Collaboration date tiles missing");
 const v1=dim(d1.closest(".rh-date-shell")),v2=dim(d2.closest(".rh-date-shell"));
 report.collaboration={dateCount:collab.querySelectorAll(".rh-date-shell").length,gap:Math.round(v2.left-v1.right),lastDate:collab.querySelectorAll(".rh-date-shell").length};
 assert(v2.left-v1.right>=8||Math.abs(v2.top-v1.top)>20,"Collaboration dates still touch");
 const added=collab.querySelector(".rh-collab-content-card");
 assert(added?.querySelectorAll(".rh-date-shell").length===2,"Nested Content date tiles missing");
 output.textContent=JSON.stringify({ok:true,report});
 }catch(e){output.textContent=JSON.stringify({ok:false,error:String(e),report});}
}
frame.addEventListener("load",checkPage,{once:true});frame.style.width=(new URLSearchParams(location.search).get("w")||"1194")+"px";frame.src="/?qa-date-overlap="+Date.now();
</script></body></html>
