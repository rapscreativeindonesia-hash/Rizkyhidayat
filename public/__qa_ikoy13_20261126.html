<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><pre id="result">Memeriksa 13 lagu Ikoy Music…</pre><iframe id="app" src="about:blank" style="width:420px;height:750px;position:absolute;left:-6000px;top:0;border:0"></iframe><script>
const out=document.querySelector("#result"),frame=document.querySelector("#app");
const targets=[
 {track:11,n:6,size:5513857,duration:344.58},
 {track:12,n:5,size:4304283,duration:268.98},
 {track:13,n:4,size:3733351,duration:233.30}
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const verify=(b,msg)=>{if(!b)throw Error(msg)};
async function analyzeAudio(parts,expected){
 const data=new Blob(parts,{type:"audio/mpeg"}),url=URL.createObjectURL(data),audio=new Audio();
 try{
  audio.preload="metadata";audio.src=url;
  const duration=await Promise.race([new Promise((ok,fail)=>{
    audio.addEventListener("loadedmetadata",()=>ok(audio.duration),{once:true});
    audio.addEventListener("error",()=>fail(Error("Audio metadata failed")),{once:true});
  }),new Promise((_,fail)=>setTimeout(()=>fail(Error("Audio metadata timeout")),9000))]);
  verify(Number.isFinite(duration)&&Math.abs(duration-expected)<1,"MP3 length incorrect");
  return duration;
 }finally{audio.removeAttribute("src");audio.load();URL.revokeObjectURL(url)}
}
async function run(){
 let results={tracks:[],assetsOk:0};
 try{
  const w=frame.contentWindow;await sleep(250);
  const scripts=[...w.document.scripts].map(x=>x.textContent).join("\n");
  const match=scripts.match(/const MUSIC_TRACKS=\[([\s\S]*?)\];/);
  verify(match,"Playlist script not found");
  results.count=(match[1].match(/\{title:"Track \d+"/g)||[]).length;
  verify(results.count===13,"Expected 13 tracks, got "+results.count);
  results.autoplayAttempt=scripts.includes("musicTryPlay();");
  results.shuffleActive=scripts.includes("musicShuffle(");
  verify(results.autoplayAttempt&&results.shuffleActive,"Playback behavior changed");
  for(const entry of targets){
   const parts=await Promise.all(Array.from({length:entry.n},(_,i)=>{
     const name="/audio/ikoy-track-"+entry.track+".part"+String(i+1).padStart(2,"0")+".bin";
     return fetch(name+"?qa="+Date.now(),{cache:"no-store"}).then(async r=>{
       verify(r.ok,"Missing asset "+name+" HTTP "+r.status);
       const b=await r.arrayBuffer();
       verify(b.byteLength>50000,"Empty audio part "+name);
       results.assetsOk++;
       return b;
     });
   }));
   const bytes=parts.reduce((n,b)=>n+b.byteLength,0);
   verify(bytes===entry.size,"Track "+entry.track+" byte length mismatch "+bytes);
   const duration=await analyzeAudio(parts,entry.duration);
   results.tracks.push({track:entry.track,parts:entry.n,bytes,duration:Number(duration.toFixed(3))});
  }
  out.textContent=JSON.stringify({ok:true,results});
 }catch(e){out.textContent=JSON.stringify({ok:false,error:String(e.message||e),results})}
}
frame.addEventListener("load",run,{once:true});frame.src="/?ikoy13qa="+Date.now();
</script></body></html>
