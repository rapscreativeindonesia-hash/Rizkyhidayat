.music-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.music-overline{font-size:10px;letter-spacing:.22em;font-weight:800;color:#d6e4e8}.music-equalizer{display:flex;align-items:end;gap:3px;height:15px}.music-equalizer i{display:block;width:3px;height:6px;background:#b5d7e5;border-radius:4px}.music-widget.is-playing .music-equalizer i{animation:musicEQ 900ms ease-in-out infinite alternate}.music-equalizer i:nth-child(2){height:12px;animation-delay:.2s}.music-equalizer i:nth-child(3){height:9px;animation-delay:.4s}.music-equalizer i:nth-child(4){height:14px;animation-delay:.1s}

<script>
(function(){
"use strict";
var KEY="iky-creator-hub-local-v1";
var initial={profile:{handle:"@ikyhdyat",followers:0,views:0,likes:0,videos:0},ideas:[],assets:[],brands:[]};

var tiktokSync=null,tiktokConfig=null;
var tiktokFetchInProgress=false;
async function loadTikTok(){
 if(tiktokFetchInProgress||document.visibilityState==="hidden")return;
 tiktokFetchInProgress=true;
 try{
  const oldConfigMode=tiktokConfig?.mode,previous=JSON.stringify(tiktokSync);
  if(!tiktokConfig){
   const c=await fetch("/api/tiktok/config",{credentials:"same-origin",cache:"no-store"});
   if(c.ok)tiktokConfig=await c.json();
  }
  const r=await fetch("/api/tiktok/status",{credentials:"same-origin",cache:"no-store"});
  if(!r.ok)throw Error("Status TikTok HTTP "+r.status);
  tiktokSync=await r.json();
  if(page==="dashboard"&&(previous!==JSON.stringify(tiktokSync)||oldConfigMode!==tiktokConfig?.mode)){
   if(!document.querySelector(".tt-action-menu[open]"))render();
  }
  updateLiveIndicator();
 }catch(e){console.warn("TikTok status temporarily unavailable:",e.message);}
 finally{tiktokFetchInProgress=false;}
}
async function connectTikTok(){
 try{
  if(!tiktokConfig)await loadTikTok();
  if(!tiktokConfig?.app_configured||!tiktokConfig?.session_configured){
   alert("Koneksi TikTok belum siap. Periksa Client Key, Client Secret, serta secret sesi dashboard di Cloudflare.");
   return;
  }
  const r=await fetch("/api/tiktok/connect",{method:"POST",credentials:"same-origin"});

async function loadCloudWorkspace(){

   const r=await fetch("/api/workspace",{credentials:"same-origin",cache:"no-store"});

   if(!r.ok)throw new Error("Cloudflare "+r.status);
   const j=await r.json();
   if(!j.ok)throw new Error(j.error||"Cloudflare gagal membaca workspace");
   cloudAccess="ok";cloudLastSaved=j.saved_at||null;
   state=mergeClientWorkspace(state,j.workspace);
   if(!writeLocal())notice("Data cloud terbaca, tetapi browser tidak bisa menyimpan salinan lokal.","warn");
   if(page!=="dashboard")render();
   scheduleCloudSave(); // Migrate legacy local records to the server, preserving existing cloud records.
 }catch(e){

async function syncCloudWorkspace(){

 try{
   const r=await fetch("/api/workspace",{method:"PUT",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({workspace:state})});
   if(r.status===401){cloudAccess="local";notice("Konten tersimpan di perangkat ini.","warn");return;}
   const j=await r.json();
   if(!r.ok||!j.ok)throw new Error(j.error||"Server gagal menyimpan");
   state=mergeClientWorkspace(state,j.workspace); // Do not discard local changes made during the request.
   writeLocal();cloudLastSaved=j.saved_at;cloudAccess="ok";
   notice("Konten berhasil tersimpan di Cloudflare.","ok");
 }catch(e){
   cloudAccess="local";notice("Simpan cloud gagal. Salinan tetap ada di perangkat ini: "+e.message,"warn");
 }finally{
   cloudBusy=false;
   if(page!=="dashboard"&&!document.getElementById("modal-layer")?.classList.contains("open"))render();
 }
}

 return '<section class="rh-builder-section" data-group="'+txt(kind)+'"><div class="rh-builder-head"><div><h4>'+txt(title)+'</h4><p>'+({script:"Satu baris untuk satu kalimat. Atur urutan sesuai alur konten.",shots:"Setiap shot dapat dihubungkan ke kalimat script dan dicentang.",checklist:"Centang pekerjaan yang telah selesai. Tanpa status produksi.",deliverables_checklist:"Checklist kewajiban kerja sama dengan brand.",references:"Simpan lebih dari satu URL referensi.",files:"Simpan link brief atau folder file.",final_links:"Tautan hasil konten yang sudah dikirim atau dipublikasikan."}[kind]||"")+'</p></div>'+btn("+ Tambah","builder-add","rh-mini-btn",'data-kind="'+txt(kind)+'"')+'</div><div class="rh-builder-list" data-kind="'+txt(kind)+'">'+items.map(x=>rhBuilderRow(kind,x,scriptRows)).join("")+'</div></section>';
}
function rhCollectRows(form,kind){
 const container=form.querySelector('.rh-builder-list[data-kind="'+kind+'"]');
 if(!container)return [];
 const fields=kind==="script"?["type","text"]:kind==="shots"?["text","angle","scriptId","checked"]:(kind==="checklist"||kind==="deliverables_checklist")?["text","checked"]:["label","url"];
 return [...container.querySelectorAll(".rh-builder-row")].map(row=>{
   const item={id:row.dataset.rowId||id()};
   for(const field of fields){
     const input=row.querySelector('[data-field="'+field+'"]');
     item[field]=field==="checked"?!!input?.checked:String(input?.value||"").trim();
   }
   return item;
 }).filter(x=>!!(x.text||x.url||x.label));
}
let rhDraftSaveTimer=null;
function saveWorkingContent(form){
 if(!form||form.getAttribute("id")!=="content-form")return;
 try{
   const fd=new FormData(form),get=k=>String(fd.get(k)||"").trim();
   const script=rhCollectRows(form,"script"),shots=rhCollectRows(form,"shots");
   if(!(get("title")||get("notes")||get("caption")||script.some(x=>x.text)||shots.some(x=>x.text)))return;
   const valueId=get("id")||form.dataset.draftContentId||id();
   let content=state.ideas.find(x=>x.id===valueId);
   if(!content){content={id:valueId,stage:"Ide"};state.ideas.push(content);}
   form.dataset.draftContentId=valueId;
   for(const key of ["platform","content_type","goal","date","shoot_date","brand_id","notes","caption","hashtags","folder_url","published_url"])content[key]=get(key);
   content.title=get("title")||"Konten belum diberi judul";
   content.script=script;content.shots=shots;content.checklist=rhCollectRows(form,"checklist");content.references=rhCollectRows(form,"references");
   content.hook=script.find(x=>x.type==="Hook")?.text||"";
   content.pillar=content.content_type||"UGC";content.updated_at=Date.now();
   if(!writeLocal())throw Error("Penyimpanan browser gagal");
   saveDraft(form);
   const el=form.querySelector("[data-draft-saved]");
   if(el)el.textContent="Draf tersimpan otomatis";
   if(cloudAccess==="ok"||cloudAccess==="saving")scheduleCloudSave();
 }catch(error){
   console.warn("Draft save failed",error);
   const el=form.querySelector("[data-draft-saved]");
   if(el)el.textContent="Penyimpanan otomatis gagal — jangan tutup halaman.";
 }
}
function queueWorkingContent(form){
 if(!form||form.getAttribute("id")!=="content-form")return;
 clearTimeout(rhDraftSaveTimer);
 rhDraftSaveTimer=setTimeout(()=>{if(form.isConnected)saveWorkingContent(form);},500);
}
function rhLoadScriptRows(form){
 return rhCollectRows(form,"script").map(x=>({id:x.id,type:x.type}));
}
function rhRefreshShotChoices(form){
 const src=rhLoadScriptRows(form);
 form.querySelectorAll('.rh-builder-list[data-kind="shots"] .rh-builder-row select[data-field="scriptId"]').forEach(sel=>{
   const original=sel.value;
   sel.innerHTML='<option value="">Tanpa hubungan script</option>'+src.map((x,i)=>'<option value="'+txt(x.id)+'">Kalimat '+(i+1)+' · '+txt(x.type)+'</option>').join("");
   sel.value=src.some(x=>x.id===original)?original:"";
 });
}
function rhReplaceBuilderRows(form,kind,items){
 const container=form.querySelector('.rh-builder-list[data-kind="'+kind+'"]');if(!container)return;
 container.innerHTML=(items||[]).map(item=>rhBuilderRow(kind,item,rhLoadScriptRows(form))).join("");
 if(kind==="script")rhRefreshShotChoices(form);
}

function pendingContentDraft(){

function modal(title,body){
 document.getElementById("modal-title").textContent=title;
 document.getElementById("modal-content").innerHTML=body;
 document.getElementById("modal-layer").classList.add("open");
 document.getElementById("modal-layer").setAttribute("aria-hidden","false");
 const form=document.getElementById("modal-content").querySelector("form");
 if(form){
   // Safari can silently suppress submit when an optional URL/email field is incomplete.
   // Preserve all drafts, but perform required-field checks in our submit handler.
   form.noValidate=true;
   restoreFormDraft(form);
 }
}

/* Drafts protect text against accidental navigation or lost browser state. */
const DRAFT_PREFIX="rh-creator-draft-v1:";
function draftKey(form){return DRAFT_PREFIX+form.getAttribute("id")+":"+(form.elements.namedItem("id")?.value||"new");}
function saveDraft(form){
 if(!form||!["idea-form","content-form","asset-form","brand-form","profile-form"].includes(form.getAttribute("id")))return;
 const values=Object.fromEntries(new FormData(form).entries());
 const sections={};for(const kind of RH_BUILDER_KEYS)if(form.querySelector('.rh-builder-list[data-kind="'+kind+'"]'))sections[kind]=rhCollectRows(form,kind);
 const draft=JSON.stringify({values,sections,draftContentId:form.dataset.draftContentId||"",updated_at:Date.now()});
 try{localStorage.setItem(draftKey(form),draft);}
 catch(e){try{sessionStorage.setItem(draftKey(form),draft);}catch(_){}}
}
function restoreFormDraft(form){
 let draft=null;
 try{draft=localStorage.getItem(draftKey(form))||sessionStorage.getItem(draftKey(form));}catch(e){}
 if(!draft)return;
 try{
  const parsed=JSON.parse(draft);
  if(parsed.draftContentId)form.dataset.draftContentId=parsed.draftContentId;
  for(const [key,value] of Object.entries(parsed.values||{})){
   if(key==="id")continue;
   const field=form.elements.namedItem(key);
   if(field&&"value" in field)field.value=String(value);
  }
  if(parsed.sections&&typeof parsed.sections==="object"){
    for(const kind of RH_BUILDER_KEYS)if(Array.isArray(parsed.sections[kind]))rhReplaceBuilderRows(form,kind,parsed.sections[kind]);
    rhRefreshShotChoices(form);
  }
  const marker=document.createElement("div");marker.className="restored-draft";
  marker.textContent="Draf tulisan sebelumnya dipulihkan otomatis.";
  form.prepend(marker);
 }catch(e){}
}
function clearFormDraft(form){
 for(const storage of [localStorage,sessionStorage]){
  try{storage.removeItem(draftKey(form));}catch(e){}
 }
}

       kind==="shots"?{id:id(),text:"",angle:"",scriptId:"",checked:false}:
       ["checklist","deliverables_checklist"].includes(kind)?{id:id(),text:"",checked:false}:{id:id(),label:"",url:""};
     list.insertAdjacentHTML("beforeend",rhBuilderRow(kind,seed,rhLoadScriptRows(form)));
     list.lastElementChild?.querySelector("textarea,input[data-field='text'],input[data-field='label']")?.focus();
   }
   if(a==="builder-remove"&&row)row.remove();
   if(a==="builder-up"&&row?.previousElementSibling)list.insertBefore(row,row.previousElementSibling);
   if(a==="builder-down"&&row?.nextElementSibling)list.insertBefore(row.nextElementSibling,row);
   if(kind==="script")rhRefreshShotChoices(form);
   saveDraft(form);queueWorkingContent(form);
   return;
 }
 if(a==="close"){close();return;}
 if(a==="new-content"){contentForm(null,el.dataset.date||"",el.dataset.brandId||"");return;}
 if(a==="edit-content"){contentForm(which);return;}
 if(a==="new-collab-content"){contentForm(null,"",which);return;}
 if(a==="new-idea"){ideaForm(null,el.dataset.date||"");return;}
 if(a==="edit-idea"){ideaForm(which);return;}
 if(a==="new-asset"){assetForm();return;}
 if(a==="new-brand"){brandForm();return;}
 if(a==="edit-brand"){brandForm(which);return;}
 if(a==="edit-profile"){profileForm();return;}
 if(a==="connect-tiktok"){connectTikTok();return;}
 if(a==="refresh-tiktok"){refreshTikTok();return;}
 if(a==="check-tiktok"){loadTikTok();return;}
 if(a==="tab-ideas"){libTab="ideas";render();return;}
 if(a==="tab-assets"){libTab="assets";render();return;}
 if(a==="go-calendar"){setpage("calendar");return;}
 if(a==="go-production"){setpage("production");return;}
 if(a==="prev-month"){calendarOffset--;render();return;}
 if(a==="next-month"){calendarOffset++;render();return;}
 if(a==="date-click"){contentForm(null,el.dataset.date);return;}
 if(["delete-idea","delete-asset","delete-brand"].includes(a)){
   if(!confirm("Hapus data ini?"))return;
   const prop=a==="delete-idea"?"ideas":a==="delete-asset"?"assets":"brands";
   ensureDeleted(state);
   state.deleted[prop][which]=Date.now();
   state[prop]=state[prop].filter(x=>x.id!==which);
   if(prop==="brands"){
     // Preserve associated content when its parent Collaboration is deleted.
     for(const content of state.ideas)if(content.brand_id===which){content.brand_id="";content.updated_at=Date.now();}
   }
   try{save();render();}catch(error){alert(error.message);}
 }
});
document.addEventListener("submit",function(e){
 const form=e.target;
 window.__rhSaveStage="event:"+String(form?.getAttribute("id")||"unknown");
 if(!["content-form","idea-form","asset-form","brand-form","profile-form"].includes(form.getAttribute("id")))return;
 e.preventDefault();
 window.__rhSaveStage="prevented";
 const fd=new FormData(form),get=k=>String(fd.get(k)||"").trim();
 window.__rhSaveStage="formdata";
 try{
   const isLink=(s)=>!s||!!safeWebLink(s);
   if(form.getAttribute("id")==="content-form"){
     if(!get("title"))throw new Error("Judul konten perlu diisi sebelum menyimpan.");
     const script=rhCollectRows(form,"script"),shots=rhCollectRows(form,"shots"),checks=rhCollectRows(form,"checklist"),refs=rhCollectRows(form,"references");
     // Draft or incomplete URLs must never prevent saving an otherwise complete content.
     const brandId=get("brand_id");
     if(brandId&&!state.brands.some(b=>b.id===brandId))throw new Error("Collaboration terkait tidak ditemukan.");
     let content=state.ideas.find(x=>x.id===(get("id")||form.dataset.draftContentId));
     if(!content){content={id:id(),stage:"Ide"};state.ideas.push(content);}
     form.dataset.draftContentId=content.id;
     for(const field of ["title","platform","content_type","goal","date","shoot_date","brand_id","notes","caption","hashtags","folder_url","published_url"])content[field]=get(field);
     content.script=script;content.shots=shots;content.checklist=checks;content.references=refs;
     content.hook=script.find(x=>x.type==="Hook")?.text||"";
     content.pillar=content.content_type||content.pillar||"UGC";
     content.campaign=state.brands.find(x=>x.id===brandId)?.campaign||"";
     content.updated_at=Date.now();
   }else if(form.getAttribute("id")==="idea-form"){
     let content=state.ideas.find(x=>x.id===get("id"));
     if(!content){content={id:id(),stage:"Ide"};state.ideas.push(content);}
     for(const field of ["title","hook","pillar","platform","notes","date"])content[field]=get(field);
     // Updating an idea must not erase an existing multi-sentence script.
     if(Array.isArray(content.script)&&content.script.length&&content.hook){
       const hook=content.script.find(x=>x.type==="Hook");
       if(hook)hook.text=content.hook;
     }
     content.updated_at=Date.now();
   }else if(form.getAttribute("id")==="asset-form"){
     const url=get("url");
     if(!safeWebLink(url))throw new Error("Masukkan link http/https yang valid.");
     state.assets.push({id:id(),title:get("title"),url,kind:get("kind"),updated_at:Date.now()});
   }else if(form.getAttribute("id")==="brand-form"){
     if(!get("name"))throw new Error("Nama brand perlu diisi sebelum menyimpan.");
     const refs=rhCollectRows(form,"references"),files=rhCollectRows(form,"files"),finalLinks=rhCollectRows(form,"final_links");
     // Store incomplete website and reference links as drafts without blocking save.
     let b=state.brands.find(x=>x.id===get("id"));
     if(!b){b={id:id()};state.brands.push(b);}
     for(const field of ["name","industry","contact","phone","email","website","social","campaign","goal","collaboration_type","status","deadline","post_date","deliverables","notes","brief_must","brief_avoid","compensation_type","barter","rate_notes"])b[field]=get(field);
     for(const field of ["value","rate_card","dp","paid"])b[field]=Math.max(0,Number(get(field))||0);
     b.deliverables_checklist=rhCollectRows(form,"deliverables_checklist");
     b.references=refs;b.files=files;b.final_links=finalLinks;b.updated_at=Date.now();
   }else if(form.getAttribute("id")==="profile-form"){
     state.profile.handle=get("handle");
     for(const field of ["followers","views","likes","videos"])state.profile[field]=Math.max(0,Number(get(field))||0);
     state.profile.updated_at=Date.now();
   }
   window.__rhSaveStage="saving";
   save();window.__rhSaveStage="stored";clearFormDraft(form);close();render();window.__rhSaveStage="rendered";
 }catch(error){
   window.__rhSaveStage="error";window.__rhSaveError=String(error?.message||error);
   notice("Gagal menyimpan: "+error.message,"warn");
   alert("Data belum berhasil disimpan. Formulir tetap terbuka. "+error.message);
 }
});
document.getElementById("modal-layer").addEventListener("click",function(e){if(e.target===this)close();});document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});

/* Original generative ambient player (no licensed tracks or Spotify credentials) */
const MUSIC_MOODS=[
 {title:"Blue Hour",subtitle:"Original ambient • Mood 01",color:"#3a718c",notes:[196,246.94,293.66]},
 {title:"Coffee Break",subtitle:"Original ambient • Mood 02",color:"#705645",notes:[174.61,220,261.63]},
 {title:"Afterglow",subtitle:"Original ambient • Mood 03",color:"#486578",notes:[164.81,220,329.63]}
];
let musicMood=0,musicPlaying=false,musicAudio=null,musicMaster=null,musicOscillators=[],musicInterval=null;
function setMusicMood(index){
 musicMood=(index+MUSIC_MOODS.length)%MUSIC_MOODS.length;
 const w=document.getElementById("music-widget"),m=MUSIC_MOODS[musicMood];if(!w)return;
 w.dataset.mood=String(musicMood);w.style.setProperty("--mood-light",m.color);
 document.getElementById("music-track").textContent=m.title;
 document.getElementById("music-subtitle").textContent=m.subtitle;
 if(musicAudio&&musicPlaying){
  musicOscillators.forEach((osc,i)=>osc.frequency.setTargetAtTime(m.notes[i],musicAudio.currentTime,.38));
 }
}
async function toggleMusic(){
 const w=document.getElementById("music-widget"),btn=document.getElementById("music-toggle");
 if(!w||!btn)return;
 if(!musicAudio){
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioClass){document.getElementById("music-state").textContent="UNSUPPORTED";return;}
  musicAudio=new AudioClass();musicMaster=musicAudio.createGain();musicMaster.gain.value=0;musicMaster.connect(musicAudio.destination);
  MUSIC_MOODS[0].notes.forEach((freq,i)=>{
   const oscillator=musicAudio.createOscillator(),gain=musicAudio.createGain();
   oscillator.type=i===1?"triangle":"sine";oscillator.frequency.value=freq;
   gain.gain.value=i===0?.18:i===1?.045:.07;
   oscillator.connect(gain).connect(musicMaster);oscillator.start();musicOscillators.push(oscillator);
  });
 }
 try{await musicAudio.resume();}catch(_){}
 musicPlaying=!musicPlaying;const volume=document.getElementById("music-volume").value/100;
 musicMaster.gain.setTargetAtTime(musicPlaying?volume*.30:0,musicAudio.currentTime,.12);
 w.classList.toggle("is-playing",musicPlaying);btn.textContent=musicPlaying?"Ⅱ":"▶";btn.setAttribute("aria-pressed",String(musicPlaying));btn.setAttribute("aria-label",musicPlaying?"Jeda musik":"Putar musik");
 document.getElementById("music-state").textContent=musicPlaying?"PLAYING":"PAUSED";
}
function updateLiveIndicator(){
 const el=document.getElementById("sync-age");if(!el)return;
 const at=Date.parse(el.dataset.syncedAt||"");if(!Number.isFinite(at)){el.textContent="";return;}
 const secs=Math.max(0,Math.floor((Date.now()-at)/1000));
 const text=secs<60?secs+" detik":secs<3600?Math.floor(secs/60)+" menit "+secs%60+" detik":Math.floor(secs/3600)+" jam "+Math.floor(secs%3600/60)+" menit";
 el.textContent=" · "+text+" lalu";
}
document.addEventListener("click",e=>{
 if(!e.target.closest(".tt-action-menu"))document.querySelectorAll(".tt-action-menu[open]").forEach(x=>x.open=false);
 if(e.target.closest("#music-toggle")){toggleMusic();return;}
 if(e.target.closest("#music-next")){setMusicMood(musicMood+1);return;}
});
document.getElementById("music-volume")?.addEventListener("input",e=>{
 if(musicMaster&&musicAudio&&musicPlaying)musicMaster.gain.setTargetAtTime((Number(e.target.value)/100)*.30,musicAudio.currentTime,.1);
});
setMusicMood(0);
setInterval(()=>{setMusicMood(musicMood+1);},3000);
setInterval(updateLiveIndicator,1000);

setInterval(()=>{
 if(page==="dashboard"&&document.visibilityState==="visible")loadTikTok();
},10000);
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&page==="dashboard")loadTikTok();
});

render();
loadTikTok();
loadCloudWorkspace();
})();
