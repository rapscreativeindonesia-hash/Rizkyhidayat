<script>
(function(){
 // Start fetching and playing before CSS, external fonts or body parsing.
 var audio=new Audio();
 var tracks=[0,1,3,4,5,6],first=tracks[Math.floor(Math.random()*tracks.length)];
 audio.id="ikoy-audio";
 audio.preload="auto";
 audio.autoplay=true;
 audio.setAttribute("playsinline","");
 audio.dataset.initialIndex=String(first);
 audio.volume=.35;
 window.__ikoyStartup={audio:audio,promise:null,error:null};
 audio.src="/audio/ikoy-track-"+String(first+1).padStart(2,"0")+".mp3";
 try{
  var playback=audio.play();
  if(playback&&playback.then){
   window.__ikoyStartup.promise=playback;
   playback.catch(function(error){window.__ikoyStartup.error=error;});
  }
 }catch(error){window.__ikoyStartup.error=error;}
})();
</script>

/* Reliable workspace save feedback and restored draft UI */
#save-notice{position:fixed;bottom:24px;right:24px;z-index:10000;width:min(420px,calc(100vw - 32px));padding:15px 19px;border:1px solid #64a38e;border-radius:12px;background:#193b35;color:#e4f7ee;box-shadow:0 12px 40px #0007;font:600 13px/1.55 "Manrope",sans-serif;opacity:0;visibility:hidden;transform:translateY(10px);transition:.15s ease;pointer-events:none}

<script>
(function(){
"use strict";
var KEY="iky-creator-hub-local-v1";
var initial={profile:{handle:"@ikyhdyat",followers:0,views:0,likes:0,videos:0},ideas:[],assets:[],brands:[]};

var tiktokSync=null,tiktokConfig=null;
var tiktokFetchInProgress=false;
async function loadTikTok(){
 if(tiktokFetchInProgress||document.visibilityState==="hidden")return;
 tiktokFetchInProgress=true;
 try{
  const oldConfigMode=tiktokConfig?.mode,previous=JSON.stringify(tiktokSync);
  if(!tiktokConfig){
   const c=await fetch("/api/tiktok/config",{credentials:"same-origin",cache:"no-store"});
   if(c.ok)tiktokConfig=await c.json();
  }
  const r=await fetch("/api/tiktok/status",{credentials:"same-origin",cache:"no-store"});
  if(!r.ok)throw Error("Status TikTok HTTP "+r.status);
  tiktokSync=await r.json();
  if(page==="dashboard"&&(previous!==JSON.stringify(tiktokSync)||oldConfigMode!==tiktokConfig?.mode)){
   if(!document.querySelector(".tt-action-menu[open]"))render();
  }
  updateLiveIndicator();
 }catch(e){console.warn("TikTok status temporarily unavailable:",e.message);}
 finally{tiktokFetchInProgress=false;}
}
async function connectTikTok(){
 try{
  if(!tiktokConfig)await loadTikTok();
  if(!tiktokConfig?.app_configured||!tiktokConfig?.session_configured){
   alert("Koneksi TikTok belum siap. Periksa Client Key, Client Secret, serta secret sesi dashboard di Cloudflare.");
   return;
  }
  const r=await fetch("/api/tiktok/connect",{method:"POST",credentials:"same-origin"});
  const j=await r.json();
  if(!r.ok||!j.authorize_url)throw Error(j.error||"Koneksi gagal");
  window.location.assign(j.authorize_url);
 }catch(e){alert("Tidak bisa menghubungkan TikTok: "+e.message);}
}
async function refreshTikTok(){
 try{
  const r=await fetch("/api/tiktok/sync",{method:"POST",credentials:"same-origin"});
  const j=await r.json();
  if(r.status===401){alert("Akun TikTok masih terhubung. Untuk sinkron manual dari perangkat ini, buka menu tiga titik dan aktifkan kontrol TikTok. Sinkronisasi otomatis server tetap berjalan.");return;}
  if(!r.ok)throw Error(j.error||"Sinkronisasi gagal");
  await loadTikTok();alert("Data TikTok berhasil disinkronkan dari API resmi.");
 }catch(e){alert("Sinkronisasi gagal: "+e.message);}
}

function load(){for(const storage of [localStorage,sessionStorage]){try{const s=JSON.parse(storage.getItem(KEY));if(s&&Array.isArray(s.ideas)&&Array.isArray(s.brands)&&Array.isArray(s.assets))return s;}catch(e){}}return JSON.parse(JSON.stringify(initial));}
var state=load(),page="dashboard",libTab="ideas",calendarOffset=0;
var cloudAccess="checking",cloudSaveTimer=null,cloudBusy=false,cloudLastSaved=null;
function ensureDeleted(doc){
 if(!doc.deleted||typeof doc.deleted!=="object")doc.deleted={};
 for(const k of ["ideas","assets","brands"])if(!doc.deleted[k]||typeof doc.deleted[k]!=="object")doc.deleted[k]={};
 return doc;
}
ensureDeleted(state);
function mergeClientWorkspace(local,remote){
 const src=ensureDeleted(local),other=ensureDeleted(remote||JSON.parse(JSON.stringify(initial)));
 const out={profile:(Number(other.profile?.updated_at)||0)>(Number(src.profile?.updated_at)||0)?other.profile:src.profile,ideas:[],assets:[],brands:[],deleted:{ideas:{},assets:{},brands:{}}};
 for(const group of ["ideas","assets","brands"]){
   const del={...(src.deleted[group]||{})};
   for(const [key,when] of Object.entries(other.deleted[group]||{}))del[key]=Math.max(Number(del[key])||0,Number(when)||0);
   const records=new Map();
   for(const item of other[group]||[])if(item?.id)records.set(item.id,item);
   for(const item of src[group]||[]){
     if(!item?.id)continue;const prev=records.get(item.id);
     if(!prev||(Number(item.updated_at)||0)>=(Number(prev.updated_at)||0))records.set(item.id,item);
   }
   out[group]=[...records.values()].filter(x=>!Object.prototype.hasOwnProperty.call(del,x.id)||(Number(x.updated_at)||0)>(Number(del[x.id])||0));
   out.deleted[group]=del;
 }
 return out;
}
var rhStorageTier="persistent";
function writeLocal(){
 let value;
 try{value=JSON.stringify(state);}catch(error){console.error("Serialisasi konten gagal",error);return false;}
 for(const storage of [localStorage,sessionStorage]){
   try{
     storage.setItem(KEY,value);
     if(storage.getItem(KEY)!==value)throw Error("Verifikasi gagal");
     rhStorageTier=storage===localStorage?"persistent":"session";
     return true;
   }catch(error){console.warn("Storage tier failed",error);}
 }
 rhStorageTier="unavailable";
 return false;
}
function notice(message,kind){
 let el=document.getElementById("save-notice");
 if(!el){el=document.createElement("div");el.id="save-notice";el.setAttribute("role","status");el.setAttribute("aria-live","polite");document.body.appendChild(el);}
 el.textContent=message;el.dataset.kind=kind||"ok";el.classList.add("visible");
 clearTimeout(notice._timer);notice._timer=setTimeout(()=>el.classList.remove("visible"),7000);
}
function save(){
 ensureDeleted(state);
 if(!writeLocal())throw new Error("Browser menolak menyimpan data. Konten masih ada di formulir; salin dulu sebelum menutupnya.");
 if(cloudAccess==="ok"||cloudAccess==="saving")scheduleCloudSave();
 else notice(rhStorageTier==="session"?"Konten tersimpan sementara pada tab ini. Jangan tutup browser sebelum menyalin data.":"Konten tersimpan di perangkat ini.",rhStorageTier==="session"?"warn":"ok");
}
function scheduleCloudSave(){
 if(cloudAccess!=="ok"&&cloudAccess!=="saving")return;
 cloudAccess="saving";
 clearTimeout(cloudSaveTimer);
 cloudSaveTimer=setTimeout(()=>{syncCloudWorkspace().catch(e=>console.error("Cloud sync failed",e));},450);
}
async function loadCloudWorkspace(){
 try{
   const r=await fetch("/api/workspace",{credentials:"same-origin",cache:"no-store"});
   if(r.status===401){cloudAccess="local";if(page!=="dashboard")render();return;}
   if(!r.ok)throw new Error("Cloudflare "+r.status);
   const j=await r.json();
   if(!j.ok)throw new Error(j.error||"Cloudflare gagal membaca workspace");
   cloudAccess="ok";cloudLastSaved=j.saved_at||null;
   state=mergeClientWorkspace(state,j.workspace);
   if(!writeLocal())notice("Data cloud terbaca, tetapi browser tidak bisa menyimpan salinan lokal.","warn");
   render();
   scheduleCloudSave(); // Migrate legacy local records to the server, preserving existing cloud records.
 }catch(e){
   cloudAccess="local";console.warn("Workspace cloud unavailable:",e);
   if(page!=="dashboard")render();
 }
}
async function syncCloudWorkspace(){
 if(cloudBusy){scheduleCloudSave();return;}
 if(cloudAccess!=="ok"&&cloudAccess!=="saving")return;
 cloudBusy=true;cloudAccess="saving";
 try{
   const r=await fetch("/api/workspace",{method:"PUT",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({workspace:state})});
   if(r.status===401){cloudAccess="local";notice("Konten tersimpan di perangkat ini.","warn");return;}
   const j=await r.json();
   if(!r.ok||!j.ok)throw new Error(j.error||"Server gagal menyimpan");
   state=mergeClientWorkspace(state,j.workspace); // Do not discard local changes made during the request.
   writeLocal();cloudLastSaved=j.saved_at;cloudAccess="ok";
   notice("Konten berhasil tersimpan di Cloudflare.","ok");
 }catch(e){
   cloudAccess="local";notice("Simpan cloud gagal. Salinan tetap ada di perangkat ini: "+e.message,"warn");
 }finally{
   cloudBusy=false;
   if(page!=="dashboard"&&!document.getElementById("modal-layer")?.classList.contains("open"))render();
 }
}

function growthChart(history){

const h=history.filter(x=>Number.isFinite(x.followers)).slice(-60);if(h.length<2)return '<div class="empty">Belum ada data pertumbuhan yang cukup.</div>';

function deadlineKey(label,date){return label+"|"+date;}
function workspaceEvents(){
 const events=[];
 function add(item,date,type,label,action){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))return;
  const key=deadlineKey(label,date),saved=(item.deadline_checks||[]).find(x=>x.id===key);
  const defaultDone=action==="edit-brand"?item.status==="Selesai":label.endsWith("Posting")?!!item.published_url:label.endsWith("Shooting")&&item.shots?.length>0&&item.shots.every(x=>x.checked===true);
  events.push({id:item.id,date,type,label,title:item.title||item.name||"Tanpa judul",platform:item.platform||"",action,key,checked:saved?saved.checked===true:!!defaultDone});
 }
 for(const item of state.ideas){
  const kind=workspaceKind(item),label=kind==="idea"?"Ide":kind==="collaboration"?"Collaboration":"Content",action=kind==="idea"?"edit-idea":"edit-content";
  add(item,item.date,kind,label+" · Posting",action);
  if(kind!=="idea"){
   add(item,item.shoot_date,kind,label+" · Shooting",action);
   for(const task of item.checklist||[]){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(task.deadline||"")||!task.id)continue;
    events.push({id:item.id,date:task.deadline,type:kind,label:label+" · "+(task.phase||"Checklist"),title:(task.text||"Checklist")+" — "+(item.title||"Konten"),platform:item.platform||"",action,key:"task|"+task.id+"|"+task.deadline,taskId:task.id,checked:task.checked===true,description:task.description||""});
   }
  }
 }
 for(const brand of state.brands){
  const related=state.ideas.filter(x=>x.brand_id===brand.id);
  add(brand,brand.deadline,"collaboration","Collaboration · Deadline","edit-brand");
  if(!related.some(x=>x.date===brand.post_date))add(brand,brand.post_date,"collaboration","Collaboration · Posting","edit-brand");
 }
 return events.sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title));
}
function deadlineRows(events,day){
 return events.map(x=>{
  const when=x.date<day?"Lewat deadline":x.date===day?"Hari ini":"Besok";
  return '<div class="rh-deadline-row'+(x.checked?' is-done':'')+'"><button type="button" class="rh-deadline-tick" role="checkbox" aria-checked="'+x.checked+'" aria-label="'+txt((x.checked?'Batalkan selesai: ':'Tandai selesai: ')+x.title+" · "+x.label)+'" data-action="deadline-toggle" data-id="'+txt(x.id)+'" data-source="'+txt(x.action)+'" data-key="'+txt(x.key)+'">'+(x.checked?'✓':'')+'</button><button type="button" class="rh-deadline-copy" data-action="'+txt(x.action)+'" data-id="'+txt(x.id)+'"><strong>'+txt(x.title)+'</strong><small>'+txt(x.label)+' · '+txt(fmt(x.date))+'</small></button><span class="rh-deadline-when'+(!x.checked&&x.date<day?' overdue':'')+'">'+txt(when)+'</span></div>';
 }).join("");
}

function performanceGraph(history){

 if(h.length<2)return empty("Grafik views muncul setelah minimal dua snapshot video valid.");
 const min=Math.min(...h.map(v=>v.recent_views)),max=Math.max(...h.map(v=>v.recent_views)),range=Math.max(1,max-min);

 const pts=h.map(v=>(12+496*(Date.parse(v.at)-t0)/Math.max(1,t1-t0)).toFixed(1)+","+(106-90*(v.recent_views-min)/range).toFixed(1)).join(" ");

}

/* Expand writing fields with their content, including restored drafts on iOS Safari. */
function rhFitTextarea(field){
 if(!field||field.tagName!=="TEXTAREA")return;
 field.style.overflowY="hidden";
 field.style.height="auto";
 const computed=window.getComputedStyle(field);
 const border=(parseFloat(computed.borderTopWidth)||0)+(parseFloat(computed.borderBottomWidth)||0);
 const minimum=parseFloat(computed.minHeight)||38;
 const required=Math.ceil(field.scrollHeight+border);
 field.style.height=Math.max(minimum,required)+"px";
}
function rhFitTextareas(root){
 if(!root)return;
 if(root.tagName==="TEXTAREA")rhFitTextarea(root);
 else root.querySelectorAll?.("textarea").forEach(rhFitTextarea);
}

/* Drafts protect text against accidental navigation or lost browser state. */
const DRAFT_PREFIX="rh-creator-draft-v1:";
function draftKey(form){const brand=form.getAttribute("id")==="content-form"?form.elements.namedItem("brand_id")?.value:"";return DRAFT_PREFIX+form.getAttribute("id")+":"+(form.elements.namedItem("id")?.value||(brand?"new-brand-"+brand:"new"));}
function saveDraft(form){
 if(!form||!["idea-form","content-form","asset-form","brand-form","profile-form"].includes(form.getAttribute("id")))return;
 const values=Object.fromEntries(new FormData(form).entries());
 const isCollab=form.getAttribute("id")==="brand-form",sections={};
 for(const kind of RH_BUILDER_KEYS){
   if(isCollab&&["script","shots","checklist"].includes(kind))continue;
   if(form.querySelector('.rh-builder-list[data-kind="'+kind+'"]'))sections[kind]=rhCollectRows(form,kind);
 }
 const inlineContent=isCollab?rhCollectCollabContent(form):null;
 const deletedContentIds=isCollab?JSON.parse(form.dataset.deletedContentIds||"[]"):null;
 const draft=JSON.stringify({values,sections,inlineContent,deletedContentIds,draftContentId:form.dataset.draftContentId||"",updated_at:Date.now()});
 try{localStorage.setItem(draftKey(form),draft);}
 catch(e){try{sessionStorage.setItem(draftKey(form),draft);}catch(_){}}
}
function restoreFormDraft(form){
 let draft=null;
 try{draft=localStorage.getItem(draftKey(form))||sessionStorage.getItem(draftKey(form));}catch(e){}
 if(!draft)return;
 try{
  const parsed=JSON.parse(draft);
  if(parsed.sections&&Array.isArray(parsed.sections.checklist)){
   const p=normalizeProduction(parsed.sections.shots||[],parsed.sections.checklist);
   parsed.sections.shots=p.shots;parsed.sections.checklist=p.checklist;
  }
  if(parsed.draftContentId)form.dataset.draftContentId=parsed.draftContentId;
  for(const [key,value] of Object.entries(parsed.values||{})){
   if(key==="id"||key==="brand_id"||(key==="content_type"&&form.id==="content-form"&&!form.elements.namedItem("brand_id")?.value))continue;
   const field=form.elements.namedItem(key);
   if(field&&"value" in field)field.value=String(value);
  }
  const isCollab=form.getAttribute("id")==="brand-form";
  if(parsed.sections&&typeof parsed.sections==="object"){
    for(const kind of RH_BUILDER_KEYS){
      if(isCollab&&["script","shots","checklist"].includes(kind))continue;
      if(Array.isArray(parsed.sections[kind]))rhReplaceBuilderRows(form,kind,parsed.sections[kind]);
    }
    if(!isCollab)rhRefreshShotChoices(form);
  }
  if(isCollab){
    if(Array.isArray(parsed.inlineContent)&&parsed.inlineContent.length){
      const list=form.querySelector(".rh-collab-content-list");
      if(list)list.innerHTML=parsed.inlineContent.map((item,i)=>rhCollabContentCard(item,i===0)).join("");
    }
    form.dataset.deletedContentIds=JSON.stringify(Array.isArray(parsed.deletedContentIds)?parsed.deletedContentIds:[]);
    rhPdfInput(form);
    form.querySelectorAll(".rh-collab-content-card").forEach(card=>rhRefreshShotChoices(card));
  }
  const marker=document.createElement("div");marker.className="restored-draft";
  marker.textContent="Draf tulisan sebelumnya dipulihkan otomatis.";
  form.prepend(marker);
 }catch(e){}
}
function clearFormDraft(form){
 for(const storage of [localStorage,sessionStorage]){
  try{storage.removeItem(draftKey(form));}catch(e){}
 }
}

 const month=Number(match[2]),day=Number(match[3]);

}

 +'<label class="field rh-date-field">Tanggal Posting'+rhDateControl("date",item.date,"content","Tanggal Posting")+'</label></div>'
 +rhBuilder("script","Script per Kalimat",scripts,[],scripts)
 +rhBuilder("shots","Shot List",shots,[{id:id(),text:"",angle:"",checked:false}],scripts)
 +rhBuilder("checklist","Checklist Produksi",checks,[],scripts)

 +'<div class="rh-collab-fields"><label class="field rh-wide">Konsep / Catatan<textarea data-content-field="notes" placeholder="Catatan untuk produksi">'+txt(item.notes||"")+'</textarea></label>'

 +'</div></details>';

function rhCollectCollabContent(form){
 return [...form.querySelectorAll(".rh-collab-content-card")].map(card=>{
   const get=k=>String(card.querySelector('[data-content-field="'+k+'"]')?.value||"").trim();
   const item={id:card.dataset.contentId||id(),title:get("title"),platform:get("platform")||"TikTok",date:get("date"),shoot_date:get("shoot_date"),notes:get("notes"),caption:get("caption"),hashtags:get("hashtags"),published_url:get("published_url")};
   for(const kind of ["script","shots","checklist","references"])item[kind]=rhCollectRows(card,kind);
   const meaningful=item.title||item.script.some(x=>x.text)||item.shots.some(x=>x.text||x.media?.length)||item.notes||item.caption||item.date;
   if(!meaningful&&!state.ideas.some(x=>x.id===item.id))return null;
   item.title=item.title||"Konten belum diberi judul";
   item.content_type="UGC";item.goal="Awareness";
   item.hook=item.script.find(x=>x.type==="Hook")?.text||"";
   item.pillar="UGC";item.updated_at=Date.now();
   return item;
 }).filter(Boolean);
}

let rhPdfDB=null;
function rhOpenPdfDB(){
 if(!("indexedDB" in window))return Promise.reject(Error("Penyimpanan file tidak didukung browser ini"));
 if(rhPdfDB)return rhPdfDB;
 rhPdfDB=new Promise((resolve,reject)=>{
   const req=indexedDB.open("rh-collaboration-brief-pdf",1);
   req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("briefs"))db.createObjectStore("briefs",{keyPath:"id"});};
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||Error("Gagal membuka penyimpanan PDF"));
 }).catch(err=>{rhPdfDB=null;throw err;});
 return rhPdfDB;
}
async function rhPutPdfLocal(key,blob,name){
 const db=await rhOpenPdfDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("briefs","readwrite");
   tx.objectStore("briefs").put({id:key,blob,name,created_at:Date.now()});
   tx.oncomplete=()=>resolve(true);
   tx.onerror=()=>reject(tx.error||Error("Gagal menyimpan PDF di perangkat"));
   tx.onabort=()=>reject(tx.error||Error("Penyimpanan PDF dibatalkan"));
 });
}
async function rhGetPdfLocal(key){
 const db=await rhOpenPdfDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("briefs","readonly"),req=tx.objectStore("briefs").get(key);
   req.onsuccess=()=>resolve(req.result?.blob||null);
   req.onerror=()=>reject(req.error||Error("Gagal membaca PDF"));
 });
}
async function rhHandlePdfUpload(form,file){
 if(!file)return;
 const status=form.querySelector("[data-brief-status]");
 if(file.size>8*1024*1024)throw Error("PDF terlalu besar. Maksimal 8 MB.");
 const bytes=await file.arrayBuffer(),header=new TextDecoder().decode(bytes.slice(0,5));
 if(header!=="%PDF-")throw Error("File tidak dikenali sebagai PDF yang valid.");
 const key="pdf_"+id();
 if(status)status.textContent="Menyimpan PDF…";
 let local=false,cloud=false;
 try{await rhPutPdfLocal(key,new Blob([bytes],{type:"application/pdf"}),file.name);local=true;}
 catch(error){console.warn("Local PDF store failed:",error);}
 try{
   const response=await fetch("/api/collaboration-pdf/"+key,{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/pdf"},body:bytes});
   cloud=response.ok;
 }catch(error){console.warn("Cloud PDF upload unavailable:",error);}
 if(!local&&!cloud)throw Error("PDF belum tersimpan. Cek ruang penyimpanan browser atau sesi akun.");
 const values={brief_pdf_id:key,brief_pdf_name:file.name.slice(0,180),brief_pdf_size:String(file.size),brief_pdf_cloud:cloud?"yes":"no",brief_pdf_date:String(Date.now())};
 for(const [field,value] of Object.entries(values)){
   const el=form.querySelector('[name="'+field+'"]');if(el)el.value=value;
 }
 rhPdfInput(form);
 saveDraft(form);
 notice(cloud?"PDF tersimpan di Cloudflare dan perangkat ini.":"PDF tersimpan di perangkat ini. Simpan Collaboration untuk menautkannya.","ok");
}
async function rhOpenBriefPdf(source){
 const meta=source?.querySelector?rhBriefPdfMeta(source):{
   id:source?.brief_pdf_id||"",name:source?.brief_pdf_name||"",size:source?.brief_pdf_size||0,cloud:source?.brief_pdf_cloud||"no"
 };
 if(!meta.id){alert("Belum ada PDF yang dilampirkan.");return;}
 const tab=window.open("about:blank","_blank");
 try{
   let pdf=null;
   try{pdf=await rhGetPdfLocal(meta.id);}catch(_){}
   if(!pdf&&meta.cloud==="yes"){
     const response=await fetch("/api/collaboration-pdf/"+encodeURIComponent(meta.id),{credentials:"same-origin",cache:"no-store"});
     if(response.ok)pdf=await response.blob();
   }
   if(!pdf)throw Error("PDF tidak ada di perangkat ini. Jika tersimpan di perangkat lain tanpa sinkron cloud, buka PDF dari perangkat asal.");
   const blobUrl=URL.createObjectURL(pdf);
   if(tab)tab.location.href=blobUrl;
   else{
     const a=document.createElement("a");a.href=blobUrl;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
   }
   setTimeout(()=>URL.revokeObjectURL(blobUrl),120000);
 }catch(e){if(tab)tab.close();alert(e.message||"Tidak dapat membuka PDF");}
}

   if(a==="builder-down"&&row?.nextElementSibling)list.insertBefore(row.nextElementSibling,row);

   }
   try{save();render();}catch(error){alert(error.message);}
 }
});
document.addEventListener("submit",function(e){
 const form=e.target;
 window.__rhSaveStage="event:"+String(form?.getAttribute("id")||"unknown");
 if(!["content-form","idea-form","asset-form","brand-form","profile-form"].includes(form.getAttribute("id")))return;
 e.preventDefault();
 window.__rhSaveStage="prevented";
 const fd=new FormData(form),get=k=>String(fd.get(k)||"").trim();
 window.__rhSaveStage="formdata";
 try{
   const isLink=(s)=>!s||!!safeWebLink(s);
   if(form.getAttribute("id")==="content-form"){
     if(!get("title"))throw new Error("Judul konten perlu diisi sebelum menyimpan.");
     const script=rhCollectRows(form,"script"),shots=rhCollectRows(form,"shots"),checks=rhCollectRows(form,"checklist"),refs=rhCollectRows(form,"references");
     // Draft or incomplete URLs must never prevent saving an otherwise complete content.
     const brandId=get("brand_id");
     if(brandId&&!state.brands.some(b=>b.id===brandId))throw new Error("Collaboration terkait tidak ditemukan.");
     let content=state.ideas.find(x=>x.id===(get("id")||form.dataset.draftContentId));
     if(!content){content={id:id(),stage:"Ide"};state.ideas.push(content);}
     form.dataset.draftContentId=content.id;
     for(const field of ["title","platform","content_type","goal","date","shoot_date","brand_id","notes","caption","hashtags","folder_url","published_url"])content[field]=get(field);
     content.script=script;content.shots=shots;content.checklist=checks;content.references=refs;
     content.hook=script.find(x=>x.type==="Hook")?.text||"";
     if(!brandId)content.content_type="Personal Branding";
     content.pillar=content.content_type||content.pillar||"UGC";
     content.workspace_kind=brandId?"collaboration":"content";content.campaign=state.brands.find(x=>x.id===brandId)?.campaign||"";
     content.updated_at=Date.now();
   }else if(form.getAttribute("id")==="idea-form"){
     let content=state.ideas.find(x=>x.id===get("id"));
     if(!content){content={id:id(),stage:"Ide"};state.ideas.push(content);}
     for(const field of ["title","hook","pillar","platform","notes","date"])content[field]=get(field);
     content.workspace_kind="idea";
     // Updating an idea must not erase an existing multi-sentence script.
     if(Array.isArray(content.script)&&content.script.length&&content.hook){
       const hook=content.script.find(x=>x.type==="Hook");
       if(hook)hook.text=content.hook;
     }
     content.updated_at=Date.now();
   }else if(form.getAttribute("id")==="asset-form"){
     const url=get("url");
     if(!safeWebLink(url))throw new Error("Masukkan link http/https yang valid.");
     state.assets.push({id:id(),title:get("title"),url,kind:get("kind"),updated_at:Date.now()});
   }else if(form.getAttribute("id")==="brand-form"){
     if(!get("name"))throw new Error("Nama brand perlu diisi sebelum menyimpan.");
     const refs=rhCollectRows(form,"references"),files=rhCollectRows(form,"files"),finalLinks=rhCollectRows(form,"final_links");
     // Store incomplete website and reference links as drafts without blocking save.
     let b=state.brands.find(x=>x.id===get("id"));
     if(!b){b={id:id()};state.brands.push(b);}
     for(const field of ["name","industry","contact","phone","email","website","social","campaign","goal","collaboration_type","status","deadline","post_date","deliverables","notes","brief_text","brief_must","brief_avoid","compensation_type","barter","rate_notes","brief_pdf_id","brief_pdf_name","brief_pdf_cloud","brief_pdf_date"])b[field]=get(field);
     for(const field of ["value","rate_card","dp","paid","brief_pdf_size"])b[field]=Math.max(0,Number(get(field))||0);
     b.deliverables_checklist=rhCollectRows(form,"deliverables_checklist");
     b.references=refs;b.files=files;b.final_links=finalLinks;b.updated_at=Date.now();
     // Save the production editors as the same Content projects shown on Content and Calendar.
     const productions=rhCollectCollabContent(form);
     for(const edited of productions){
       let project=state.ideas.find(x=>x.id===edited.id);
       if(project&&project.brand_id&&project.brand_id!==b.id)continue;
       if(!project){project={id:edited.id,stage:"Ide"};state.ideas.push(project);}
       Object.assign(project,edited,{workspace_kind:"collaboration",brand_id:b.id,campaign:b.campaign||"",updated_at:Date.now()});
     }
     const removed=JSON.parse(form.dataset.deletedContentIds||"[]");
     ensureDeleted(state);
     for(const deletedId of removed){
       const linked=state.ideas.find(x=>x.id===deletedId);
       if(!linked||linked.brand_id!==b.id)continue;
       state.deleted.ideas[deletedId]=Date.now();
       state.ideas=state.ideas.filter(x=>x.id!==deletedId);
     }
   }else if(form.getAttribute("id")==="profile-form"){
     state.profile.handle=get("handle");
     for(const field of ["followers","views","likes","videos"])state.profile[field]=Math.max(0,Number(get(field))||0);
     state.profile.updated_at=Date.now();
   }
   window.__rhSaveStage="saving";
   save();window.__rhSaveStage="stored";clearFormDraft(form);close();render();window.__rhSaveStage="rendered";
 }catch(error){
   window.__rhSaveStage="error";window.__rhSaveError=String(error?.message||error);
   notice("Gagal menyimpan: "+error.message,"warn");
   alert("Data belum berhasil disimpan. Formulir tetap terbuka. "+error.message);
 }
});

 {title:"Closer",artist:"The Chainsmokers feat. Halsey",parts:["/audio/ikoy-track-13.part01.bin","/audio/ikoy-track-13.part02.bin","/audio/ikoy-track-13.part03.bin","/audio/ikoy-track-13.part04.bin"]}
];
const MUSIC_THEMES=[
 {name:"Arctic",color:"#3e728f",background:"radial-gradient(ellipse at 16% 5%,#bbebffb8,transparent 48%),linear-gradient(125deg,#173346,#4e819d 58%,#c6d9de)"},
 {name:"Copper",color:"#8b5e58",background:"radial-gradient(circle at 80% 15%,#ffd7b386,transparent 50%),linear-gradient(115deg,#32292f,#815950 56%,#cc9f84)"},
 {name:"Midnight",color:"#4b5b9e",background:"radial-gradient(circle at 20% 5%,#b7bbffa0,transparent 49%),linear-gradient(130deg,#151b42,#464d8e 65%,#7779b0)"},
 {name:"Forest",color:"#547970",background:"radial-gradient(ellipse at 70% 10%,#d2e9cb9c,transparent 51%),linear-gradient(120deg,#142f36,#3d7167 64%,#8eb4a3)"},
 {name:"Rose",color:"#986a86",background:"radial-gradient(circle at 14% 90%,#ffc4dd80,transparent 50%),linear-gradient(125deg,#33233d,#7d5378 60%,#c3a0b1)"},
 {name:"Dawn",color:"#8d7463",background:"radial-gradient(ellipse at 70% 15%,#fff2b4a8,transparent 51%),linear-gradient(120deg,#263f52,#8a8079 63%,#f0caa9)"}
];
const MUSIC_PLAY_ICON='<svg class="rh-vector-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 9 6-9 6z"/></svg>';
const MUSIC_PAUSE_ICON='<svg class="rh-vector-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg>';
let musicAudio=null,musicPlaying=false,musicIndex=-1,musicQueue=[],musicHistory=[],musicForward=[],musicLoading=0,musicNeedGesture=false,musicThemeIndex=0,musicThemeFront=0,musicThemeTimer=null;
const musicResolvedURLs=new Map();
function musicShuffle(indices){
 for(let i=indices.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [indices[i],indices[j]]=[indices[j],indices[i]];
 }
 return indices;
}
function musicStatus(text){
 const el=document.getElementById("music-state");
 if(el)el.textContent=text;
}
function musicPaint(){
 const w=document.getElementById("music-widget"),btn=document.getElementById("music-toggle");
 if(w)w.classList.toggle("is-playing",musicPlaying);
 if(btn){btn.innerHTML=musicPlaying?MUSIC_PAUSE_ICON:MUSIC_PLAY_ICON;btn.setAttribute("aria-pressed",String(musicPlaying));btn.setAttribute("aria-label",musicPlaying?"Jeda musik":"Putar musik");}
 const track=MUSIC_TRACKS[musicIndex];
 if(track){const title=document.getElementById("music-track");title.textContent=track.title;title.title=track.title;document.getElementById("music-subtitle").textContent=track.artist+" · Shuffle aktif";}
}
function musicCycleTheme(){
 const w=document.getElementById("music-widget");
 if(!w)return;
 musicThemeIndex=(musicThemeIndex+1)%MUSIC_THEMES.length;
 const theme=MUSIC_THEMES[musicThemeIndex];
 const layers=[document.getElementById("music-theme-one"),document.getElementById("music-theme-two")];
 musicThemeFront=1-musicThemeFront;
 const next=layers[musicThemeFront],old=layers[1-musicThemeFront];
 if(next)next.style.background=theme.background;
 if(old)old.classList.remove("is-visible");
 if(next)next.classList.add("is-visible");
 w.style.setProperty("--mood-light",theme.color);
 w.dataset.theme=String(musicThemeIndex);
}
function musicInitialIndex(){
 // A direct MP3 makes the first autoplay attempt synchronous even on iOS.
 const ready=MUSIC_TRACKS.map((x,i)=>x.url?i:-1).filter(i=>i>=0);
 return ready[Math.floor(Math.random()*ready.length)];
}
function musicNextIndex(){
 if(musicForward.length)return musicForward.shift();
 if(!musicQueue.length){
  musicQueue=musicShuffle(MUSIC_TRACKS.map((_,i)=>i).filter(i=>i!==musicIndex));
 }
 return musicQueue.shift();
}
function musicSetState(state){
 musicPlaying=state==="playing";
 musicNeedGesture=state==="blocked";
 musicStatus(state==="playing"?"PLAYING":state==="blocked"?"":state==="loading"?"LOADING":state==="error"?"SKIPPED":"PAUSED");
 musicPaint();
}
async function musicURLFor(index){
 const track=MUSIC_TRACKS[index];
 if(track.url)return track.url;
 if(musicResolvedURLs.has(index))return musicResolvedURLs.get(index);
 const responses=await Promise.all(track.parts.map(path=>fetch(path,{cache:"force-cache"})));
 if(responses.some(r=>!r.ok))throw Error("MP3 track not found: "+track.title);
 const parts=await Promise.all(responses.map(r=>r.arrayBuffer()));
 const url=URL.createObjectURL(new Blob(parts,{type:"audio/mpeg"}));
 musicResolvedURLs.set(index,url);
 return url;
}
function musicTryPlay(){
 if(!musicAudio)return;
 musicNeedGesture=false;
 let attempt;
 try{attempt=musicAudio.play();}
 catch(e){musicSetState("blocked");return;}
 if(attempt&&typeof attempt.then==="function"){
  attempt.then(()=>{musicSetState("playing");})
    .catch(e=>{if(e?.name==="AbortError")return;musicSetState(e?.name==="NotAllowedError"?"blocked":"error");});
 }else musicSetState("playing");
}
async function musicSelect(index,autoplay=true){
 const serial=++musicLoading;
 musicIndex=index;
 musicSetState("loading");
 try{
  const src=await musicURLFor(index);
  if(serial!==musicLoading)return;
  if(!musicAudio)musicAudio=new Audio();
  musicAudio.src=src;
  musicAudio.preload="auto";
  musicAudio.volume=Number(document.getElementById("music-volume")?.value||35)/100;
  musicAudio.load();
  musicPaint();
  if(autoplay)musicTryPlay();
  else musicSetState("paused");
 }catch(e){
  if(serial!==musicLoading)return;
  console.warn("Ikoy Music file error",e);
  musicSetState("error");
  // Skip broken files without trapping the playback queue.
  if(musicQueue.length)musicSelect(musicNextIndex(),autoplay);
 }
}
function musicResumeOnInteraction(event){
 if(!musicNeedGesture||!musicAudio)return;
 // The explicit player buttons handle their own click: prevent a gesture/play double-toggle.
 if(event?.target?.closest?.("#music-toggle,#music-next,#music-prev"))return;
 // Execute play() synchronously inside any ordinary interaction.
 musicTryPlay();
}
function musicPause(){
 if(!musicAudio)return;
 musicAudio.autoplay=false;
 musicAudio.pause();
 musicNeedGesture=false;
 musicSetState("paused");
}
function toggleMusic(){
 if(musicPlaying){musicPause();return;}
 if(musicAudio){musicTryPlay();return;}
 musicSelect(musicInitialIndex(),true);
}
function nextMusic(){
 if(!musicAudio){musicSelect(musicInitialIndex(),true);return;}
 if(musicIndex>=0)musicHistory.push(musicIndex);
 musicSelect(musicNextIndex(),true);
}
function previousMusic(){
 if(!musicAudio)return;
 if(musicHistory.length){
   musicForward.unshift(musicIndex);
   musicSelect(musicHistory.pop(),true);
 }else{
   try{musicAudio.currentTime=0;musicTryPlay();}catch(e){}
 }
}
function initMusic(){
 musicAudio=window.__ikoyStartup?.audio||new Audio();
 musicAudio.preload="auto";
 musicAudio.volume=Number(document.getElementById("music-volume")?.value||35)/100;
 musicAudio.addEventListener("playing",()=>musicSetState("playing"));
 musicAudio.addEventListener("ended",nextMusic);
 musicAudio.addEventListener("error",()=>{if(musicIndex>=0&&musicQueue.length)nextMusic();});
 const w=document.getElementById("music-widget"),firstLayer=document.getElementById("music-theme-one");
 if(firstLayer)firstLayer.style.background=MUSIC_THEMES[0].background;
 if(w){w.dataset.theme="0";w.style.setProperty("--mood-light",MUSIC_THEMES[0].color);}
 if(musicThemeTimer)clearInterval(musicThemeTimer);
 musicThemeTimer=setInterval(musicCycleTheme,3000);
 const initial=Number(musicAudio.dataset.initialIndex);
 const first=Number.isInteger(initial)&&MUSIC_TRACKS[initial]?.url?initial:musicInitialIndex();
 musicQueue=musicShuffle(MUSIC_TRACKS.map((_,i)=>i).filter(i=>i!==first));
 musicIndex=first;
 if(!musicAudio.getAttribute("src"))musicAudio.src=MUSIC_TRACKS[first].url;
 musicPaint();
 const startup=window.__ikoyStartup;
 if(startup?.promise){
  const initialSerial=musicLoading;
  startup.promise.then(()=>{if(initialSerial===musicLoading&&!musicAudio.paused)musicSetState("playing");}).catch(e=>{if(initialSerial===musicLoading&&e?.name!=="AbortError")musicSetState(e?.name==="NotAllowedError"?"blocked":"error");});
 }else if(musicAudio.paused)musicTryPlay();else if(musicAudio.readyState>=3)musicSetState("playing");
 // If the browser rejects audible autoplay, retry on a trusted ordinary interaction.
 for(const event of ["touchend","click","keydown"]){
  document.addEventListener(event,musicResumeOnInteraction,{passive:true,capture:true});
 }
}
function updateLiveIndicator(){
 const el=document.getElementById("sync-age");if(!el)return;
 const at=Date.parse(el.dataset.syncedAt||"");if(!Number.isFinite(at)){el.textContent="";return;}
 const secs=Math.max(0,Math.floor((Date.now()-at)/1000));
 const text=secs<60?secs+" detik":secs<3600?Math.floor(secs/60)+" menit "+secs%60+" detik":Math.floor(secs/3600)+" jam "+Math.floor(secs%3600/60)+" menit";
 el.textContent=" · "+text+" lalu";
}
document.addEventListener("click",e=>{
 if(!e.target.closest(".tt-action-menu"))document.querySelectorAll(".tt-action-menu[open]").forEach(x=>x.open=false);
 if(e.target.closest("#music-toggle")){toggleMusic();return;}
 if(e.target.closest("#music-prev")){previousMusic();return;}
 if(e.target.closest("#music-next")){nextMusic();return;}
});
document.getElementById("music-volume")?.addEventListener("input",e=>{
 if(musicAudio)musicAudio.volume=Number(e.target.value)/100;
});
initMusic();
cleanupLocalReferences();setInterval(cleanupLocalReferences,60000);
setInterval(updateLiveIndicator,1000);

},10000);
