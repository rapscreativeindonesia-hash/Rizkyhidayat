.music-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.music-overline{font-size:10px;letter-spacing:.22em;font-weight:800;color:#d6e4e8}.music-equalizer{display:flex;align-items:end;gap:3px;height:15px}.music-equalizer i{display:block;width:3px;height:6px;background:#b5d7e5;border-radius:4px}.music-widget.is-playing .music-equalizer i{animation:musicEQ 900ms ease-in-out infinite alternate}.music-equalizer i:nth-child(2){height:12px;animation-delay:.2s}.music-equalizer i:nth-child(3){height:9px;animation-delay:.4s}.music-equalizer i:nth-child(4){height:14px;animation-delay:.1s}

<script>
(function(){
"use strict";
var KEY="iky-creator-hub-local-v1";
var initial={profile:{handle:"@ikyhdyat",followers:0,views:0,likes:0,videos:0},ideas:[],assets:[],brands:[]};

var tiktokSync=null,tiktokConfig=null;
async function loadTikTok(){
 try{
  const c=await fetch("/api/tiktok/config",{credentials:"same-origin",cache:"no-store"});
  if(!c.ok)return;
  tiktokConfig=await c.json();
  const r=await fetch("/api/tiktok/status",{credentials:"same-origin",cache:"no-store"});
  tiktokSync=r.ok?await r.json():null;
  if(page==="dashboard")render();
 }catch(e){console.warn("TikTok connection not ready",e);}
}
async function connectTikTok(){
 try{
  if(!tiktokConfig)await loadTikTok();
  if(!tiktokConfig?.app_configured||!tiktokConfig?.session_configured){
   alert("Koneksi TikTok belum siap. Periksa Client Key, Client Secret, serta secret sesi dashboard di Cloudflare.");
   return;
  }
  const r=await fetch("/api/tiktok/connect",{method:"POST",credentials:"same-origin"});
  const j=await r.json();
  if(!r.ok||!j.authorize_url)throw Error(j.error||"Koneksi gagal");
  window.location.assign(j.authorize_url);
 }catch(e){alert("Tidak bisa menghubungkan TikTok: "+e.message);}
}
async function refreshTikTok(){
 try{
  const r=await fetch("/api/tiktok/sync",{method:"POST",credentials:"same-origin"});
  const j=await r.json();
  if(r.status===401){alert("Akun TikTok masih terhubung. Untuk sinkron manual dari perangkat ini, buka menu tiga titik dan aktifkan kontrol TikTok. Sinkronisasi otomatis server tetap berjalan.");return;}
  if(!r.ok)throw Error(j.error||"Sinkronisasi gagal");
  await loadTikTok();alert("Data TikTok berhasil disinkronkan dari API resmi.");
 }catch(e){alert("Sinkronisasi gagal: "+e.message);}
}

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.ideas)&&Array.isArray(s.brands)&&Array.isArray(s.assets))return s;}catch(e){}return JSON.parse(JSON.stringify(initial));}
var state=load(),page="dashboard",libTab="ideas",calendarOffset=0;
var cloudAccess="checking",cloudSaveTimer=null,cloudBusy=false,cloudLastSaved=null;
function ensureDeleted(doc){
 if(!doc.deleted||typeof doc.deleted!=="object")doc.deleted={};
 for(const k of ["ideas","assets","brands"])if(!doc.deleted[k]||typeof doc.deleted[k]!=="object")doc.deleted[k]={};
 return doc;
}
ensureDeleted(state);
function mergeClientWorkspace(local,remote){
 const src=ensureDeleted(local),other=ensureDeleted(remote||JSON.parse(JSON.stringify(initial)));
 const out={profile:(Number(other.profile?.updated_at)||0)>(Number(src.profile?.updated_at)||0)?other.profile:src.profile,ideas:[],assets:[],brands:[],deleted:{ideas:{},assets:{},brands:{}}};
 for(const group of ["ideas","assets","brands"]){
   const del={...(src.deleted[group]||{})};
   for(const [key,when] of Object.entries(other.deleted[group]||{}))del[key]=Math.max(Number(del[key])||0,Number(when)||0);
   const records=new Map();
   for(const item of other[group]||[])if(item?.id)records.set(item.id,item);
   for(const item of src[group]||[]){
     if(!item?.id)continue;const prev=records.get(item.id);
     if(!prev||(Number(item.updated_at)||0)>=(Number(prev.updated_at)||0))records.set(item.id,item);
   }
   out[group]=[...records.values()].filter(x=>!Object.prototype.hasOwnProperty.call(del,x.id)||(Number(x.updated_at)||0)>(Number(del[x.id])||0));
   out.deleted[group]=del;
 }
 return out;
}
function writeLocal(){
 try{
   const value=JSON.stringify(state);
   localStorage.setItem(KEY,value);
   if(localStorage.getItem(KEY)!==value)throw new Error("Verifikasi data tidak cocok");
   return true;
 }catch(error){
   console.error("Penyimpanan perangkat gagal",error);
   return false;
 }
}
function notice(message,kind){
 let el=document.getElementById("save-notice");
 if(!el){el=document.createElement("div");el.id="save-notice";el.setAttribute("role","status");el.setAttribute("aria-live","polite");document.body.appendChild(el);}
 el.textContent=message;el.dataset.kind=kind||"ok";el.classList.add("visible");
 clearTimeout(notice._timer);notice._timer=setTimeout(()=>el.classList.remove("visible"),7000);
}
function save(){
 ensureDeleted(state);
 if(!writeLocal())throw new Error("Browser menolak menyimpan data. Konten masih ada di formulir; salin dulu sebelum menutupnya.");
 if(cloudAccess==="ok"||cloudAccess==="saving")scheduleCloudSave();
 else notice("Konten tersimpan di perangkat ini.","ok");
}
function scheduleCloudSave(){
 if(cloudAccess!=="ok"&&cloudAccess!=="saving")return;
 cloudAccess="saving";
 clearTimeout(cloudSaveTimer);
 cloudSaveTimer=setTimeout(()=>{syncCloudWorkspace().catch(e=>console.error("Cloud sync failed",e));},450);
}
async function loadCloudWorkspace(){
 try{
   const r=await fetch("/api/workspace",{credentials:"same-origin",cache:"no-store"});
   if(r.status===401){cloudAccess="local";if(page!=="dashboard")render();return;}
   if(!r.ok)throw new Error("Cloudflare "+r.status);
   const j=await r.json();
   if(!j.ok)throw new Error(j.error||"Cloudflare gagal membaca workspace");
   cloudAccess="ok";cloudLastSaved=j.saved_at||null;
   state=mergeClientWorkspace(state,j.workspace);
   if(!writeLocal())notice("Data cloud terbaca, tetapi browser tidak bisa menyimpan salinan lokal.","warn");
   if(page!=="dashboard")render();
   scheduleCloudSave(); // Migrate legacy local records to the server, preserving existing cloud records.
 }catch(e){
   cloudAccess="local";console.warn("Workspace cloud unavailable:",e);
   if(page!=="dashboard")render();
 }
}
async function syncCloudWorkspace(){
 if(cloudBusy){scheduleCloudSave();return;}
 if(cloudAccess!=="ok"&&cloudAccess!=="saving")return;
 cloudBusy=true;cloudAccess="saving";
 try{
   const r=await fetch("/api/workspace",{method:"PUT",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({workspace:state})});
   if(r.status===401){cloudAccess="local";notice("Konten tersimpan di perangkat ini.","warn");return;}
   const j=await r.json();
   if(!r.ok||!j.ok)throw new Error(j.error||"Server gagal menyimpan");
   state=mergeClientWorkspace(state,j.workspace); // Do not discard local changes made during the request.
   writeLocal();cloudLastSaved=j.saved_at;cloudAccess="ok";
   notice("Konten berhasil tersimpan di Cloudflare.","ok");
 }catch(e){
   cloudAccess="local";notice("Simpan cloud gagal. Salinan tetap ada di perangkat ini: "+e.message,"warn");
 }finally{
   cloudBusy=false;
   if(page!=="dashboard"&&!document.getElementById("modal-layer")?.classList.contains("open"))render();
 }
}

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function n(v){return new Intl.NumberFormat("id-ID").format(Number(v)||0);}
function rp(v){return "Rp "+n(v);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmt(d){if(!d)return "Belum dijadwalkan";return new Date(d+"T12:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});}
function chip(s){return '<span class="pill">'+esc(s)+'</span>';}
function btn(label,act,variant,extra){return '<button type="button" class="button '+(variant||"")+'" data-action="'+act+'" '+(extra||"")+'>'+label+'</button>';}
function metric(label,value,description){return '<section class="panel"><div class="kpi-label">'+label+'</div><div class="kpi">'+value+'</div><span class="muted small">'+description+'</span></section>';}
function empty(txt){return '<div class="empty">'+esc(txt)+'</div>';}
function txt(t){return esc(t);}
function setpage(p){page=p;render();}
function render(){document.querySelectorAll("[data-page]").forEach(function(x){x.classList.toggle("active",x.dataset.page===page);});var titles={dashboard:["Dashboard","Ringkasan pertumbuhan akun dan progres pekerjaanmu."],ideas:["Ide / Library","Bank ide, referensi, dan aset untuk produksi."],calendar:["Kalender Konten","Rencanakan jadwal konten di satu kalender."],production:["Produksi Content","Kelola proses konten dari ide sampai final."],brand:["Brand","Pantau prospek dan kolaborasi dengan brand."]};document.getElementById("page-title").textContent=titles[page][0];document.getElementById("page-subtitle").textContent=titles[page][1];document.querySelector(".top")?.classList.toggle("dashboard-top",page==="dashboard");const sh=document.getElementById("side-handle");if(sh)sh.textContent=state.profile.handle||"@ikyhdyat";document.getElementById("now").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"short",year:"numeric"});document.getElementById("app").innerHTML=({dashboard:dashboard,ideas:ideas,calendar:calendar,production:production,brand:brand}[page])();}
function growthChart(history){
if(!Array.isArray(history)||history.length<2)return '<div class="empty">Grafik pertumbuhan muncul setelah minimal dua sinkronisasi berhasil.</div>';
const h=history.filter(x=>Number.isFinite(x.followers)).slice(-60);if(h.length<2)return '<div class="empty">Belum ada data pertumbuhan yang cukup.</div>';
const min=Math.min(...h.map(x=>x.followers)),max=Math.max(...h.map(x=>x.followers)),range=Math.max(1,max-min);
const pts=h.map((v,i)=>(Math.round((i/(h.length-1))*500))+","+(Math.round(95-((v.followers-min)/range)*85))).join(" ");
return '<svg viewBox="0 0 520 120" role="img" aria-label="Grafik followers berdasarkan snapshot TikTok API" style="width:100%;max-height:185px;overflow:visible"><path d="M0 110 H520" stroke="#5a486b" stroke-width="1" fill="none"/><polyline points="'+pts+'" fill="none" stroke="#bc75ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="itemtop small muted"><span>Awal '+n(h[0].followers)+' followers</span><span>Terakhir '+n(h[h.length-1].followers)+' followers</span></div>';
}
function dashboard(){
 const scheduled=state.ideas.filter(x=>!!x.date),next=scheduled.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>x.date>=today()).slice(0,4);
 const connected=!!tiktokSync?.connected,live=connected&&tiktokSync?.latest?tiktokSync.latest:null;
 const isSandbox=tiktokConfig?.mode==="sandbox";
 const allZero=!!(isSandbox&&live&&live.followers===0&&live.likes===0&&live.video_count===0);
 const username=live?.username||"ikyhdyat";
 const name=live?.display_name||"Rizky Hidayat";
 const pic=live?.avatar_url?'<img class="tt-avatar" src="'+txt(live.avatar_url)+'" alt="Foto profil TikTok @'+txt(username)+'" referrerpolicy="no-referrer" loading="lazy">':'<div class="tt-avatar tt-avatar-fallback" aria-label="Foto profil belum tersedia">RH</div>';
 const age=live?.synced_at?new Date(live.synced_at).toLocaleString("id-ID"):"Menunggu sinkronisasi";
 const follower=allZero?"—":live?.followers!=null?n(live.followers):"—";
 const likes=allZero?"—":live?.likes!=null?n(live.likes):"—";
 const videos=allZero?"—":live?.video_count!=null?n(live.video_count):"—";
 const views=live?.recent_video_count>0?n(live.recent_views):"—";
 const scopeNames=new Set((tiktokSync?.scope||"").split(",").map(x=>x.trim()).filter(Boolean));
 const videoNote=live?.video_error?"Data video belum tersedia":!connected?"Belum terhubung":!scopeNames.has("video.list")?"Data video belum tersedia":live?.recent_video_count?"Dari "+n(live.recent_video_count)+" video terbaru":"Belum ada data video";

 const canSync=!!tiktokSync?.owner_session;

function calendar(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+calendarOffset);var y=d.getFullYear(),m=d.getMonth(),start=(d.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Math.ceil((start+days)/7)*7;

["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(function(w){out+='<div class="dayname">'+w+'</div>';});

/* Drafts protect text against accidental navigation or lost browser state. */
const DRAFT_PREFIX="rh-creator-draft-v1:";
function draftKey(form){return DRAFT_PREFIX+form.id+":"+(form.elements.namedItem("id")?.value||"new");}
function saveDraft(form){
 if(!form||!["idea-form","asset-form","brand-form","profile-form"].includes(form.id))return;
 const values=Object.fromEntries(new FormData(form).entries());
 try{localStorage.setItem(draftKey(form),JSON.stringify({values,updated_at:Date.now()}));}
 catch(e){try{sessionStorage.setItem(draftKey(form),JSON.stringify({values,updated_at:Date.now()}));}catch(_){}}
}
function restoreFormDraft(form){
 let draft=null;
 try{draft=localStorage.getItem(draftKey(form))||sessionStorage.getItem(draftKey(form));}catch(e){}
 if(!draft)return;
 try{
  const parsed=JSON.parse(draft);
  for(const [key,value] of Object.entries(parsed.values||{})){
   if(key==="id")continue;
   const field=form.elements.namedItem(key);
   if(field&&"value" in field)field.value=String(value);
  }
  const marker=document.createElement("div");marker.className="restored-draft";
  marker.textContent="Draf tulisan sebelumnya dipulihkan otomatis.";
  form.prepend(marker);
 }catch(e){}
}
function clearFormDraft(form){
 for(const storage of [localStorage,sessionStorage]){
  try{storage.removeItem(draftKey(form));}catch(e){}
 }
}
document.addEventListener("input",e=>{
 const form=e.target.closest("form");
 if(form)saveDraft(form);
});
document.addEventListener("change",e=>{
 const form=e.target.closest("form");
 if(form)saveDraft(form);
});

function ideaForm(id,date){var x=state.ideas.find(function(a){return a.id===id;})||{title:"",hook:"",pillar:"Education",platform:"TikTok",stage:"Ide",notes:"",date:date||""};modal(id?"Edit Ide":"Tambah Ide Konten",'<form id="idea-form"><input type="hidden" name="id" value="'+txt(id||"")+'"><div class="form-grid">'+input("Judul Konten *","title",x.title,"text","required maxlength=160")+input("Hook / Opening","hook",x.hook)+select("Pilar Konten","pillar",["Education","Entertainment","Lifestyle","UGC","Travel","Product","Lainnya"],x.pillar)+select("Platform","platform",["TikTok","Instagram","YouTube","Threads","Facebook","Multiplatform"],x.platform)+select("Status Produksi","stage",stages,x.stage)+input("Tanggal Posting","date",x.date,"date")+'<label class="field wide">Konsep / Catatan<textarea name="notes">'+txt(x.notes)+'</textarea></label></div>'+formFooter()+'</form>');}

function profileForm(){var x=state.profile;modal("Statistik Manual TikTok",'<form id="profile-form"><div class="form-grid">'+input("Username TikTok","handle",x.handle,"text","required")+input("Followers","followers",x.followers,"number","min=0")+input("Total Views","views",x.views,"number","min=0")+input("Total Likes","likes",x.likes,"number","min=0")+input("Total Video","videos",x.videos,"number","min=0")+'</div><div class="notice">Input ini manual, tidak menghubungkan akun TikTok melalui OAuth. Integrasi API resmi belum tersedia pada versi ini.</div>'+formFooter()+'</form>');}

document.addEventListener("click",function(e){var nav=e.target.closest("[data-page]");if(nav){setpage(nav.dataset.page);return;}var el=e.target.closest("[data-action]");if(!el)return;var a=el.dataset.action,which=el.dataset.id;if(a==="close")close();

if(["delete-idea","delete-asset","delete-brand"].includes(a)){if(confirm("Hapus data ini?")){var prop=a.split("-")[1];prop=prop==="idea"?"ideas":prop==="asset"?"assets":"brands";ensureDeleted(state);state.deleted[prop][which]=Date.now();state[prop]=state[prop].filter(function(v){return v.id!==which;});try{save();render();}catch(err){alert(err.message);}}}

document.addEventListener("submit",function(e){if(!["idea-form","asset-form","brand-form","profile-form"].includes(e.target.id))return;e.preventDefault();var f=new FormData(e.target),get=function(k){return String(f.get(k)||"").trim();};if(e.target.id==="idea-form"){var a=state.ideas.find(function(x){return x.id===get("id");});if(!a){a={id:id()};state.ideas.push(a);}["title","hook","pillar","platform","stage","notes","date"].forEach(function(k){a[k]=get(k);});a.updated_at=Date.now();}
if(e.target.id==="asset-form"){var u=get("url");if(!/^https?:\/\/\S+$/i.test(u))return alert("Masukkan link http/https yang valid.");state.assets.push({id:id(),title:get("title"),url:u,kind:get("kind"),updated_at:Date.now()});}
if(e.target.id==="brand-form"){var b=state.brands.find(function(x){return x.id===get("id");});if(!b){b={id:id()};state.brands.push(b);}["name","contact","deadline","status","deliverables","notes"].forEach(function(k){b[k]=get(k);});b.value=Number(get("value"))||0;b.updated_at=Date.now();}
if(e.target.id==="profile-form"){state.profile.handle=get("handle");["followers","views","likes","videos"].forEach(function(k){state.profile[k]=Math.max(0,Number(get(k))||0);});state.profile.updated_at=Date.now();}
try{
 save();
 clearFormDraft(e.target);
 close();
 render();
}catch(err){
 notice("Gagal menyimpan: "+err.message,"warn");
 alert("Gagal menyimpan data. Formulir tetap terbuka. "+err.message);
}
});
document.getElementById("modal-layer").addEventListener("click",function(e){if(e.target===this)close();});document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});

/* Original generative ambient player (no licensed tracks or Spotify credentials) */
const MUSIC_MOODS=[
 {title:"Blue Hour",subtitle:"Original ambient • Mood 01",color:"#3a718c",notes:[196,246.94,293.66]},
 {title:"Coffee Break",subtitle:"Original ambient • Mood 02",color:"#705645",notes:[174.61,220,261.63]},
 {title:"Afterglow",subtitle:"Original ambient • Mood 03",color:"#486578",notes:[164.81,220,329.63]}
];
let musicMood=0,musicPlaying=false,musicAudio=null,musicMaster=null,musicOscillators=[],musicInterval=null;
function setMusicMood(index){
 musicMood=(index+MUSIC_MOODS.length)%MUSIC_MOODS.length;
 const w=document.getElementById("music-widget"),m=MUSIC_MOODS[musicMood];if(!w)return;
 w.dataset.mood=String(musicMood);w.style.setProperty("--mood-light",m.color);
 document.getElementById("music-track").textContent=m.title;
 document.getElementById("music-subtitle").textContent=m.subtitle;
 if(musicAudio&&musicPlaying){
  musicOscillators.forEach((osc,i)=>osc.frequency.setTargetAtTime(m.notes[i],musicAudio.currentTime,.38));
 }
}
async function toggleMusic(){
 const w=document.getElementById("music-widget"),btn=document.getElementById("music-toggle");
 if(!w||!btn)return;
 if(!musicAudio){
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioClass){document.getElementById("music-state").textContent="UNSUPPORTED";return;}
  musicAudio=new AudioClass();musicMaster=musicAudio.createGain();musicMaster.gain.value=0;musicMaster.connect(musicAudio.destination);
  MUSIC_MOODS[0].notes.forEach((freq,i)=>{
   const oscillator=musicAudio.createOscillator(),gain=musicAudio.createGain();
   oscillator.type=i===1?"triangle":"sine";oscillator.frequency.value=freq;
   gain.gain.value=i===0?.18:i===1?.045:.07;
   oscillator.connect(gain).connect(musicMaster);oscillator.start();musicOscillators.push(oscillator);
  });
 }
 try{await musicAudio.resume();}catch(_){}
 musicPlaying=!musicPlaying;const volume=document.getElementById("music-volume").value/100;
 musicMaster.gain.setTargetAtTime(musicPlaying?volume*.30:0,musicAudio.currentTime,.12);
 w.classList.toggle("is-playing",musicPlaying);btn.textContent=musicPlaying?"Ⅱ":"▶";btn.setAttribute("aria-pressed",String(musicPlaying));btn.setAttribute("aria-label",musicPlaying?"Jeda musik":"Putar musik");
 document.getElementById("music-state").textContent=musicPlaying?"PLAYING":"PAUSED";
}
function updateLiveIndicator(){
 const el=document.getElementById("sync-age");if(!el)return;
 const at=new Date(el.dataset.syncedAt).getTime();if(!Number.isFinite(at))return;
 const sec=Math.max(0,Math.floor((Date.now()-at)/1000));
 const text=sec<60?sec+" detik":sec<3600?Math.floor(sec/60)+" menit "+sec%60+" detik":Math.floor(sec/3600)+" jam "+Math.floor(sec%3600/60)+" menit";
 el.textContent="Data API diperbarui "+text+" lalu";
}
document.addEventListener("click",e=>{
 if(!e.target.closest(".tt-action-menu"))document.querySelectorAll(".tt-action-menu[open]").forEach(x=>x.open=false);
 if(e.target.closest("#music-toggle")){toggleMusic();return;}
 if(e.target.closest("#music-next")){setMusicMood(musicMood+1);return;}
});
document.getElementById("music-volume")?.addEventListener("input",e=>{
 if(musicMaster&&musicAudio&&musicPlaying)musicMaster.gain.setTargetAtTime((Number(e.target.value)/100)*.30,musicAudio.currentTime,.1);
});
setMusicMood(0);
setInterval(()=>{setMusicMood(musicMood+1);},3000);
setInterval(updateLiveIndicator,1000);
setInterval(()=>{
 if(page==="dashboard"&&document.visibilityState==="visible"&&tiktokSync?.connected)loadTikTok();
},60000);

render();
loadTikTok();
loadCloudWorkspace();
})();
