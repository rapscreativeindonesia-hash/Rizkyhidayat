<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Ikoy Music QA</title></head><body><pre id="qa">RUNNING</pre><iframe id="dashboard" src="about:blank" style="width:390px;height:700px;position:absolute;left:-9000px;top:0" title="audio test"></iframe><script>
const out=document.querySelector("#qa");
const paths=["01.mp3","02.mp3","03.part01.bin","03.part02.bin","04.mp3","05.mp3","06.mp3","07.mp3","08.part01.bin","08.part02.bin","09.part01.bin","09.part02.bin","10.part01.bin","10.part02.bin","10.part03.bin"].map(f=>"/audio/ikoy-track-"+f);
const expected=[1692699,1949029,2209683,2209683,2185536,2437849,2148298,1359856,1653648,1653646,1838100,1838100,1953774,1953774,1953772];
const sizeExpected={};
paths.forEach((p,i)=>sizeExpected[p]=expected[i]);
async function test(){
 try{
  out.textContent="CHECKING "+paths.length+" AUDIO FILES";
  const results=await Promise.all(paths.map(async p=>{
   const res=await fetch(p,{method:"GET",cache:"no-store"});
   if(!res.ok)return {path:p,status:res.status,ok:false};
   const blob=await res.blob();
   return {path:p,status:res.status,size:blob.size,type:res.headers.get("content-type"),ok:blob.size===sizeExpected[p]};
  }));
  const doc=document.querySelector("#dashboard").contentDocument;
  const svg=doc.querySelectorAll(".sidebar .nav .rh-vector-icon").length;
  const title=doc.querySelector("#music-track")?.textContent;
  const state=doc.querySelector("#music-state")?.textContent;
  const failures=results.filter(x=>!x.ok);
  out.textContent=JSON.stringify({ok:failures.length===0&&svg===5&&!!title&&title.includes("/ 10"),trackFiles:paths.length,assetBytes:results.reduce((x,r)=>x+(r.size||0),0),failures,vectorIcons:svg,musicTitle:title,musicStatus:state,results:results.map(x=>[x.path,x.status,x.size,x.type])});
 }catch(error){out.textContent=JSON.stringify({ok:false,error:String(error)})}
}
document.querySelector("#dashboard").addEventListener("load",test,{once:true});document.querySelector("#dashboard").src="/?music-qa="+Date.now();
</script></body></html>
